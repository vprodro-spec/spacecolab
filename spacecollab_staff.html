<!doctype html><html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#ffffff">
<title>SpaceCoLLab · Pharmaplus</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#0b0b0f;--mut:#6b6b76;--line:rgba(60,60,67,.13);--fill:#f0f1f4;--pp:#00898b;--pp-soft:#e6f5f3;--deal:#245ad7;--deal-hi:#3d74ff;--mk:#6f4bea;--ok:#1f9d5b;--adv-bg:#e6edfc;--adv-ink:#1f49b8;--promo-bg:#fdeed7;--promo-ink:#9a5b00;--exp-bg:#e0f3ea;--exp-ink:#14633b;--r:24px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html[data-theme=dark]{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#9a9aa3;--line:rgba(120,120,128,.28);--fill:#2c2c2e;--pp-soft:#0f3233;--adv-bg:#1c2a52;--adv-ink:#9db8ff;--promo-bg:#3d2c10;--promo-ink:#ffc266;--exp-bg:#143524;--exp-ink:#7ddba3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
#app{max-width:1100px;margin:0 auto;padding:0 0 calc(96px + var(--safe-b))}
code{font:600 10.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em;padding:2px 6px;border-radius:6px;background:rgba(120,120,128,.16);color:var(--mut);white-space:nowrap}
/* λογότυπα */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + var(--safe-t)) 18px 12px;background:#fff}
.logos{display:flex;align-items:center;gap:12px}.logos img{display:block;height:30px;width:auto}.logos img+img{height:20px}.logos i{width:1px;height:26px;background:rgba(0,0,0,.16)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#3a3a3c}.who b{width:32px;height:32px;border-radius:50%;background:#0b1230;color:#fff;display:grid;place-items:center;font-size:12px}
/* σκηνή */
.stage{position:relative;background:radial-gradient(120% 90% at 85% -10%,#2a3fa8 0%,rgba(42,63,168,0) 55%),radial-gradient(90% 70% at 0% 0%,#0f5f6b 0%,rgba(15,95,107,0) 50%),linear-gradient(180deg,#0b1230 0%,#0a0f26 100%);color:#fff;padding:22px 0 26px;border-radius:0 0 34px 34px;overflow:hidden}
.hello{padding:0 22px}.hello small{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9fc0ff}
.hello h1{margin:8px 0 0;font:800 34px/1.06 -apple-system,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.035em}.hello h1 em{font-style:normal;color:#9fe7dc}
.hello p{margin:10px 0 0;font-size:15px;line-height:1.4;opacity:.82}
.count{display:flex;gap:10px;margin:18px 22px 0}
.count div{flex:1;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.count b{display:block;font:800 26px/1 -apple-system,"SF Pro Display",Arial,sans-serif;letter-spacing:-.03em}.count span{display:block;margin-top:4px;font-size:12px;opacity:.72;line-height:1.25}
.wallh{display:flex;align-items:baseline;justify-content:space-between;padding:24px 22px 10px}.wallh b{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.72}.wallh span{font-size:12.5px;opacity:.6}
.wall{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 22px 6px;scrollbar-width:none}.wall::-webkit-scrollbar{display:none}
.scr{flex:none;width:min(318px,82vw);scroll-snap-align:center;padding:12px;border-radius:26px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:#fff}
.scr .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.scr .hd b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.nb{min-width:26px;height:26px;padding:0 6px;border-radius:9px;background:#fff;color:#0b1230;display:inline-grid;place-items:center;font:800 13px/1 -apple-system,Arial,sans-serif}.nb.pp{background:var(--pp);color:#fff}
.chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:700;letter-spacing:.02em;line-height:1.5;white-space:nowrap}.chip.adv{background:var(--adv-bg);color:var(--adv-ink)}.chip.promo{background:var(--promo-bg);color:var(--promo-ink)}.chip.exp{background:var(--exp-bg);color:var(--exp-ink)}.chip.hq{background:var(--pp-soft);color:var(--pp)}
.scr code{display:inline-block;margin-top:8px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.72)}
.scr .mid{display:grid;grid-template-columns:124px minmax(0,1fr);gap:16px;margin-top:16px;align-items:stretch}
/* οθόνη όπως στο εργαλείο */
.dev{position:relative;border-radius:12px;padding:4px;background:#0c0d12;box-shadow:0 10px 22px rgba(0,0,0,.4)}.dev.P{aspect-ratio:9/16}.dev.L{aspect-ratio:16/10;align-self:start}
.dev i{position:absolute;inset:4px;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:7px;font-style:normal;background-size:cover;background-position:center top}
.dev .k{font-size:6.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.dev .t{font:800 10.5px/1.1 -apple-system,Arial,sans-serif;margin-top:2px;overflow-wrap:anywhere}

.s-custom{background:#fff;color:var(--deal);box-shadow:inset 0 0 0 2px #5476be}.s-deal{background:linear-gradient(180deg,var(--deal-hi),var(--deal));color:#fff}.s-pre{background:repeating-linear-gradient(135deg,#eef2fb 0 5px,#c9d5f3 5px 8px);color:#1f49b8}
.s-camp{background:linear-gradient(160deg,#0aa3a0,#006a70);color:#fff}.s-theme{background:#e6f5f3;color:#00767a;box-shadow:inset 0 0 0 2px var(--pp)}
.lay{display:grid;gap:8px;align-content:start}.lay div small{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.6}.lay div b{display:block;font-size:14px;font-weight:700;line-height:1.2;margin-top:1px}.lay div span{display:block;font-size:12px;opacity:.75;line-height:1.25}
.nxt{margin-top:12px;padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.1);font-size:12.5px;line-height:1.3}.nxt b{font-weight:700}.nxt.same{opacity:.62}
.loc{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;opacity:.78}.loc::before{content:"";width:8px;height:8px;border-radius:50%;background:#ffcc33;box-shadow:0 0 0 3px rgba(255,204,51,.25)}
/* κάρτες */
.sec{padding:26px 20px 0}.sec>h2{margin:0 2px 12px;font:800 22px/1.15 -apple-system,"SF Pro Display",Arial,sans-serif;letter-spacing:-.025em;display:flex;align-items:baseline;justify-content:space-between;gap:10px}.sec>h2 small{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 0 var(--line),0 10px 30px rgba(10,16,40,.05);overflow:hidden}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:13px;padding:16px;align-items:start}.task+.task{border-top:1px solid var(--line)}
.task .nb{background:var(--ink);color:var(--bg);margin-top:1px}.task .nb.pp{background:var(--pp);color:#fff}
.task h3{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em}.task p{margin:3px 0 0;font-size:13.5px;color:var(--mut);line-height:1.35}
.due{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,149,0,.16);color:#b25e00}[data-theme=dark] .due{color:#ffb340}
.acts{display:flex;gap:8px;margin-top:12px}.btn{min-height:44px;padding:0 16px;border-radius:14px;font-size:15px;font-weight:700;background:rgba(120,120,128,.14);white-space:nowrap;text-align:center}.btn.go{background:var(--ink);color:var(--bg);flex:1}
.task.fin h3{color:var(--mut);text-decoration:line-through}.task.fin .nb{background:var(--ok)!important;color:#fff}.fin .okl{color:var(--ok);font-weight:700}
/* ετικέτες κατάστασης, ίδιες με το υπόμνημα του εργαλείου */
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--fill);color:var(--ink)}
.sw{display:inline-block;width:16px;height:11px;border-radius:3px;flex:none;background:var(--fill)}
.sw.basic{background:#d9dbe2}.sw.custom{background:#fff;box-shadow:inset 0 0 0 1.5px #5476be}.sw.deal{background:linear-gradient(180deg,var(--deal-hi),var(--deal))}.sw.pre{background:repeating-linear-gradient(135deg,#f5f6f9 0 3px,#aab4c8 3px 5px)}.sw.shelf{background:transparent;border-bottom:3px double #64748b;border-radius:0}.sw.camp{background:var(--pp)}.sw.theme{background:#f3faf6;box-shadow:inset 0 0 0 1.5px var(--pp)}.sw.mk{background:rgba(111,75,234,.12);box-shadow:inset 0 0 0 1.5px var(--mk)}
.row2{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;width:100%}.row2+.row2{border-top:1px solid var(--line)}
.row2 .tx>b{display:block;font-size:15.5px;font-weight:700}.row2 .tx>span{display:block;font-size:13px;color:var(--mut);margin-top:1px;line-height:1.3}.row2 .nb{background:var(--ink);color:var(--bg)}.row2 .nb.pp{background:var(--pp);color:#fff}
.chev{color:var(--mut);font-size:20px}
/* κάτοψη */
.map{padding:14px}.map svg{display:block;width:100%;height:auto}.maplist{display:grid;gap:0;border-top:1px solid var(--line)}
/* έτος */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:0 4px 12px;font-size:12px;color:var(--mut)}.legend span{display:inline-flex;align-items:center;gap:6px}
.yr{display:grid;gap:6px;padding:14px;align-items:stretch}.yr .h{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--mut);padding:0 2px 4px;text-align:center}

  const f=dl.filter(a=>a[1]);if(f.length)o+='<dl>'+f.map(a=>'<dt>'+a[0]+'</dt><dd>'+E(a[1])+'</dd>').join('')+'</dl>';
  o+='</div><div class="blk"><small>Ράφια</small>';
  if(x.sponsor)o+='<div class="tg"><span class="st">'+sw('shelf')+'Ράφια</span></div><h3>Χορηγία ραφιών'+(x.sponsor.detail?' · '+E(x.sponsor.detail):'')+'</h3><p>'+E([x.sponsor.where,x.sponsor.n?x.sponsor.n+(x.sponsor.n===1?' χορηγία':' χορηγίες'):''].filter(Boolean).join(' · ')||'Δεν έχουν δηλωθεί λεπτομέρειες.')+'</p>';
  if(h.k==='guide'){const names=Object.keys(h.setups),cur=h.setups[S.setup]?S.setup:names[0],g=h.setups[cur]||{},pr=g.products||[];
   o+=(x.sponsor?'<p class="sep">Στα υπόλοιπα ράφια:</p>':'')+'<h3'+(x.sponsor?'':' style="margin-top:0"')+'>'+E(g.topBrand?'Κύρια μάρκα · '+g.topBrand:g.title||cur)+'</h3><div class="seg" role="tablist">'+names.map(n=>'<button role="tab" aria-selected="'+(n===cur)+'" data-setup="'+E(n)+'">'+E(n.replace(' Στήσιμο','').replace('Στήσιμο ',''))+'</button>').join('')+'</div>'+(g.title&&g.topBrand&&g.title!==g.topBrand?'<p style="margin:0 0 6px">'+E(g.title)+'</p>':'')+(pr.length?pr.map((r,k)=>'<div class="shelf"><b>'+(pr.length<=4?'Ράφι '+(k+1):'Κωδικός '+(k+1))+'</b><div class="it">'+E(r)+'</div></div>').join(''):'<p>Δεν υπάρχουν ακόμα προϊόντα για αυτό το στήσιμο.</p>');}
  else if(h.k==='free')o+=(x.sponsor?'':'<h3 style="margin-top:0">Προϊόντα της συμφωνίας</h3><p>'+(h.prod?E(h.prod):'Δεν έχουν δηλωθεί ακόμα.')+'</p>');
  else if(h.k==='rows')o+='<h3 style="margin-top:0">'+E(h.title)+'</h3>'+h.rows.map((r,k)=>r?'<div class="shelf"><b>Ράφι '+(k+1)+'</b><div class="it">'+E(r)+'</div></div>':'').join('')+(s.how?'<p>'+E(s.how)+'</p>':'');
  else if(!x.sponsor)o+='<p style="margin:0">'+(s.how?E(s.how):'Δεν υπάρχει ακόμα οδηγία για τα ράφια.')+'</p>';
  o+='</div></div>';
  if(i===0&&(x.need||d))o+=(d?'<div class="donebox"><b>Στήθηκε</b><span>'+E(when(d.at))+' · '+E(d.name)+'</span>'+((d.mine||D.me.role!=='staff')?'<button data-undo="'+p.id+'" data-dm="'+i+'"'+(S.busy?' disabled':'')+'>Αναίρεση</button>':'')+'</div>'+'<div class="ph">'+(d.photo?'<button data-view="'+p.id+'" data-dm="'+i+'"'+(S.busy?' disabled':'')+'>Δες τη φωτογραφία</button>':'')+((d.mine||D.me.role!=='staff')?'<label class="pick'+(S.busy?' off':'')+'">'+(S.busy===p.id?'Ανεβαίνει…':d.photo?'Άλλη φωτογραφία':'Πρόσθεσε φωτογραφία')+'<input type="file" accept="image/*" capture="environment" data-photo="'+p.id+'"'+(S.busy?' disabled':'')+'></label>'+(d.photo?'<button data-delphoto="'+p.id+'"'+(S.busy?' disabled':'')+'>Αφαίρεση</button>':''):'')+'</div>'+(d.photo||!(d.mine||D.me.role!=='staff')?'':'<p class="note">Προαιρετική. Μικραίνει μόνη της πριν ανέβει. Τη βλέπει μόνο το φαρμακείο.</p>'):'<button class="big" data-done="'+p.id+'" data-dm="'+i+'"'+(S.busy?' disabled':'')+'>Τα έστησα</button><p class="note">Γράφεται '+(D.me.name?'το όνομά σου':'«Φαρμακείο»')+', η ημέρα και η ώρα.</p>');
  else if(i>0&&x.need)o+='<p class="note">Το «Στήθηκε» ανοίγει την 1η '+MG[x.m]+'.</p>';
  if(S.err)o+='<p class="note err">'+E(S.err)+'</p>';}
 o+='<div class="sec" style="padding:22px 0 0"><h2 style="font-size:18px">Πού είναι</h2>'+mapCard(p.id,false)+'<p class="note" style="text-align:left">'+E(p.where)+'</p></div>';
 return o+'</div></div>';}
function header(){const n=D&&D.me&&D.me.name,ini=n?n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase():'Φ';
 return '<div class="bar"><div class="logos"><img src="'+IMG.pp+'" alt="Pharmaplus"><i></i><img src="'+IMG.scl+'" alt="SpaceCoLLab"></div>'+'<div class="who">'+(D?'<span>'+E(n||'Φαρμακείο')+'</span>':'')+'<button class="thm" data-theme-set="'+(TH.get()==='dark'?'light':'dark')+'">'+(TH.get()==='dark'?'Φωτεινό':'Σκούρο')+'</button></div></div>';}
function render(){const T=tasks(),U=coming(),open=T.filter(t=>!doneOf(t.pos,t.x)).length;let b=header();
 const now='<div class="sec"><h2>Στησίματα '+MG[NOW.m]+'<small>'+(T.length?open+(open===1?' ανοιχτό':' ανοιχτά'):'')+'</small></h2><div class="card">'+(T.length?T.map(taskHTML).join(''):'<div class="empty">Δεν χρειάζεται στήσιμο αυτόν τον μήνα.</div>')+'</div></div>';
 const up='<div class="sec"><h2>Αλλάζουν την 1η '+MG[mo(1)]+'<small>σε '+(NOW.days-NOW.d+1)+' ημέρες</small></h2><div class="card">'+(U.length?U.map(upHTML).join(''):'<div class="empty">Δεν αλλάζει καμία θέση.</div>')+'</div></div>';
 if(!POS.length)b+='<div class="sec"><div class="card"><div class="empty">Δεν υπάρχουν ακόμα θέσεις για το φαρμακείο.</div></div></div>';
 else if(S.tab==='now')b+=stage()+'<div class="grid2">'+now+up+'</div><div class="sec"><h2>Πού είναι οι θέσεις<small>'+(D.plan?'πάτα έναν αριθμό':'')+'</small></h2>'+mapCard(null,false)+'</div>';
 else if(S.tab==='next')b+='<div class="sec"><h2 class="big-h">'+MN[mo(1)]+'<small>σε '+(NOW.days-NOW.d+1)+' ημέρες</small></h2><div class="card">'+listHTML(1)+'</div></div>';
 else if(S.tab==='news')b+='<div class="sec"><h2 class="big-h">Νέα<small>συμφωνίες και στησίματα</small></h2>'+newsHTML()+'</div>';
 else if(S.tab==='year')b+='<div class="sec"><h2 class="big-h">Έτος<small>12 μήνες μπροστά</small></h2>'+yearHTML()+'</div>';
 else b+='<div class="sec"><h2 class="big-h">Κάτοψη<small>'+POS.length+(POS.length===1?' θέση':' θέσεις')+'</small></h2>'+mapCard(null,true)+'</div>';
 document.getElementById('app').innerHTML=b+'<nav class="tabs" role="tablist">'+[['now','Τώρα'],['next',MS[mo(1)]],['year','Έτος'],['map','Κάτοψη'],['news','Νέα']].map(x=>'<button role="tab" aria-selected="'+(S.tab===x[0])+'" data-tab="'+x[0]+'">'+x[1]+(x[0]==='news'&&S.tab!=='news'&&newsNew()?'<i class="dot"></i>':'')+'</button>').join('')+'</nav>'+sheet()+(S.view?'<div class="viewer" data-viewclose="1"><div><b>'+E(S.view.title)+'</b><button data-viewclose="1">Κλείσιμο</button></div><img src="'+E(S.view.url)+'" alt="Φωτογραφία στησίματος"></div>':'');
 document.body.style.overflow=S.sheet?'hidden':'';}
function screenMsg(h,p){document.getElementById('app').innerHTML=header()+'<div class="msg"><h1>'+h+'</h1><p>'+p+'</p></div>';}
async function setDone(id,i,val){const p=POS.find(x=>x.id===id),x=p&&p.mon[i];if(!x||S.busy)return;S.busy=id;S.err=null;keep(render);
 try{if(!val){const o=doneOf(p,x);if(o&&o.photo)await photoApi({action:'del',position_id:id});}
 const r=await rpc('scl375_staff_done',{p_link:LINK,p_year:x.y,p_month:x.m+1,p_position_id:id,p_done:val});D.done=(D.done||[]).filter(d=>!(d.position_id===id&&d.year===x.y&&d.month===x.m+1));if(r&&r.done)D.done.push(r);}
 catch(e){S.err=e.message||'Δεν αποθηκεύτηκε. Δοκίμασε ξανά.';if(!S.sheet)alertBar(S.err);}
 S.busy=null;keep(render);}
const LIMIT=380000;
function loadImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im);};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Δεν διαβάστηκε η φωτογραφία.'));};im.src=u;});}
async function shrink(file){let src=null;try{if(window.createImageBitmap)src=await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e){src=null;}if(!src)src=await loadImg(file);
 const W=src.width||src.naturalWidth,H=src.height||src.naturalHeight;if(!W||!H)throw new Error('Δεν διαβάστηκε η φωτογραφία.');
 let side=1600,q=.74,data='';
 for(let k=0;k<8;k++){const f=Math.min(1,side/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*f));c.height=Math.max(1,Math.round(H*f));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);
  data=c.toDataURL('image/jpeg',q).split(',')[1]||'';if(data.length*.75<=LIMIT)break;if(q>.55)q-=.1;else side=Math.round(side*.8);}
 if(!data||data.length*.75>LIMIT*1.5)throw new Error('Η φωτογραφία δεν μίκρυνε αρκετά. Δοκίμασε ξανά.');return data;}
async function addPhoto(id,file){const p=POS.find(x=>x.id===id),x=p&&p.mon[0];if(!x||!file||S.busy)return;S.busy=id;S.err=null;keep(render);
 try{const img=await shrink(file);await photoApi({action:'put',position_id:id,image:img});const d=doneOf(p,x);if(d)d.photo=true;}
 catch(e){S.err=e.message||'Δεν ανέβηκε η φωτογραφία.';if(!S.sheet)alertBar(S.err);}
 S.busy=null;keep(render);}
async function delPhoto(id){const p=POS.find(x=>x.id===id),x=p&&p.mon[0];if(!x||S.busy)return;S.busy=id;S.err=null;keep(render);
 try{await photoApi({action:'del',position_id:id});const d=doneOf(p,x);if(d)d.photo=false;}catch(e){S.err=e.message;}
 S.busy=null;keep(render);}
async function viewPhoto(id,i){const p=POS.find(x=>x.id===id),x=p&&p.mon[i];if(!x||S.busy)return;S.busy=id;S.err=null;keep(render);
 try{const r=await photoApi({action:'get',position_id:id,year:x.y,month:x.m+1});S.view={url:r.url,title:p.name+' · '+MN[x.m]+' '+x.y};}catch(e){S.err=e.message;}
 S.busy=null;keep(render);}
function alertBar(t){const n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),4200);}
function keep(fn){const sc=document.querySelector('.sheet'),top=sc?sc.scrollTop:0;fn();const n=document.querySelector('.sheet');if(n)n.scrollTop=top;}
document.addEventListener('click',e=>{const th=e.target.closest('[data-theme-set]');if(th){TH.set(th.dataset.themeSet);if(D)keep(render);else{th.dataset.themeSet=TH.get()==='dark'?'light':'dark';th.textContent=TH.get()==='dark'?'Φωτεινό':'Σκούρο';}return;}const vc=e.target.closest('[data-viewclose]');if(vc&&(vc.tagName==='BUTTON'||e.target===vc)){S.view=null;keep(render);return;}
 const t=e.target.closest('[data-tab],[data-pos],[data-done],[data-undo],[data-close],[data-sm],[data-setup],[data-view],[data-delphoto]');if(!t||!D)return;
 if(t.dataset.view){viewPhoto(t.dataset.view,+t.dataset.dm);return;}
 if(t.dataset.delphoto){delPhoto(t.dataset.delphoto);return;}
 if(t.dataset.tab){const was=S.seen;S.tab=t.dataset.tab;S.sheet=null;render();window.scrollTo(0,0);if(S.tab==='news'){S.seen=Date.now();try{localStorage.setItem('scl375-news-seen',String(S.seen));}catch(e){}}return;}
 if(t.dataset.done){setDone(t.dataset.done,+t.dataset.dm,true);return;}
 if(t.dataset.undo){setDone(t.dataset.undo,+t.dataset.dm,false);return;}
 if(t.dataset.sm){S.sm=+t.dataset.sm;S.err=null;keep(render);const a=document.querySelector('.mtabs [aria-selected=true]');if(a)a.scrollIntoView({inline:'center',block:'nearest'});return;}
 if(t.dataset.setup){S.setup=t.dataset.setup;keep(render);return;}
 if(t.dataset.pos){S.sheet=t.dataset.pos;S.sm=+(t.dataset.m||0);S.err=null;S.setup='Στήσιμο Μάρκας';render();const a=document.querySelector('.mtabs [aria-selected=true]');if(a)a.scrollIntoView({inline:'center',block:'nearest'});return;}
 if(t.dataset.close&&(t.dataset.close==='2'||e.target===t)){S.sheet=null;render();}});
document.addEventListener('change',e=>{const f=e.target.closest&&e.target.closest('input[data-photo]');if(f&&f.files&&f.files[0])addPhoto(f.dataset.photo,f.files[0]);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.view){S.view=null;keep(render);return;}if(e.key==='Escape'&&S.sheet){S.sheet=null;render();}});
(async()=>{if(!LINK){screenMsg('Χρειάζεται σύνδεσμος','Άνοιξε τη σελίδα από τον σύνδεσμο που σου έστειλε το φαρμακείο.');return;}
 screenMsg('Φορτώνει…','');
 try{D=await rpc('scl375_staff_get',{p_link:LINK});build();render();}
 catch(e){D=null;if(e.code==='P0002')screenMsg('Ο σύνδεσμος δεν ισχύει','Μπορεί να έχει ανακληθεί. Ζήτησε νέο σύνδεσμο από το φαρμακείο.');else screenMsg('Δεν φόρτωσε','Έλεγξε τη σύνδεσή σου και άνοιξε ξανά τον σύνδεσμο.');}})();
</script></body></html>
