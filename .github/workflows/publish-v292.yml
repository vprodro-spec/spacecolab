name: Build and publish SpaceCoLab

on:
  push:
    branches: [main]
    paths:
      - 'src/scl*-*.js'
      - 'data/library-seed.json'
      - 'scripts/build-v295.py'
      - 'scripts/build-v297.py'
      - 'scripts/build-v294.py'
      - 'scripts/build-v293.py'
      - 'scripts/build-v292.py'
      - '.github/workflows/publish-v292.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v292
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Commit verified application
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish verified application'
          git push origin HEAD:main
