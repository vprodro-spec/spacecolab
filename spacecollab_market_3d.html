const FTPL="<div class=\"{{rootCls}}\" data-wrap=\"1\" onPointerMove=\"{{moveAll}}\" onPointerUp=\"{{upAll}}\" onPointerCancel=\"{{upAll}}\">\n\n<header class=\"appbar\">\n  <span class=\"logo\">SpaceCoLab</span>\n  <span class=\"vdiv\"></span>\n  <span class=\"crumb\" style=\"font-weight:500;color:#6e6e73\">Κάτοψη · Ροές και ορατότητα</span>\n  <nav class=\"stepper\">\n    <sc-for list=\"{{steps}}\" as=\"st\" hint-placeholder-count=\"3\">\n      <button type=\"button\" class=\"{{st.cls}}\" onClick=\"{{st.go}}\"><span class=\"n\">{{st.n}}</span><span>{{st.label}}</span></button>\n    </sc-for>\n  </nav>\n  <span class=\"grow\"></span>\n  <span class=\"chip warn\">Εκτίμηση σχεδιασμού · όχι μέτρηση</span>\n  <button type=\"button\" class=\"btn line sm\" onClick=\"{{fx3d}}\">Μοντέλο 3D</button>\n  <button type=\"button\" class=\"btn line sm\" onClick=\"{{fxBack}}\">Πίσω στην κάτοψη</button>\n</header>\n\n<div class=\"stagewrap\">\n  <div class=\"canvas\" data-canvas=\"1\" onPointerDown=\"{{canvasDown}}\">\n    <div class=\"zone\" style=\"transform-origin:0 0;transform:{{zoneTf}}\"><sc-zone></sc-zone>\n      <div class=\"ov\" data-ov=\"1\" style=\"left:{{ovb.l}}px;top:{{ovb.t}}px;width:{{ovb.w}}px;height:{{ovb.h}}px\">\n        <div class=\"hcw\">\n          <sc-for list=\"{{cells}}\" as=\"c\" hint-placeholder-count=\"0\">\n            <i class=\"hc\" style=\"left:{{c.l}}px;top:{{c.t}}px;width:{{c.w}}px;height:{{c.h}}px;background:{{c.bg}}\"></i>\n          </sc-for>\n        </div>\n        <svg class=\"cone\" viewBox=\"{{ovb.vb}}\"><polygon points=\"{{cone}}\"></polygon></svg>\n        <svg class=\"rts\" viewBox=\"{{ovb.vb}}\">\n          <path class=\"{{rt.ac}}\" d=\"{{rt.a}}\" stroke-width=\"{{rt.aw}}\"></path>\n          <path class=\"{{rt.bc}}\" d=\"{{rt.b}}\" stroke-width=\"{{rt.bw}}\"></path>\n          <path class=\"{{rt.cc}}\" d=\"{{rt.c}}\" stroke-width=\"{{rt.cw}}\"></path>\n        </svg>\n        <sc-for list=\"{{rays}}\" as=\"r\" hint-placeholder-count=\" er-val=\"{{ false }}\">\n      <div class=\"lg\"><span>Κρύο</span><i class=\"lramp\"></i><span>Ζεστό</span></div>\n      <div class=\"lg wide\"><span class=\"lnote\">Η λέξη δίπλα σε κάθε οθόνη δείχνει πόσο ζεστή είναι η περιοχή έως 2 μέτρα μπροστά της.</span></div>\n    </sc-if>\n    <sc-if value=\"{{m.vis}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"lg\"><i class=\"vdot hi\"></i><span>Φαίνεται καλά</span></div>\n      <div class=\"lg\"><i class=\"vdot mid\"></i><span>Φαίνεται λίγο</span></div>\n      <div class=\"lg\"><i class=\"vdot lo\"></i><span>Δεν φαίνεται</span></div>\n      <div class=\"lg\"><i class=\"vdot blk\"></i><span>Κάτι την κρύβει</span></div>\n      <div class=\"lg\"><i class=\"lcone\"></i><span>Προς τα πού κοιτάει</span></div>\n    </sc-if>\n    <p class=\"fnote\">Εκτιμήσεις σχεδιασμού. Θα διορθώνονται με πραγματικά στοιχεία (QR Βιτρίνας, πωλήσεις).</p>\n  </div>\n\n  <aside class=\"fl insp fi\">\n    <sc-if value=\"{{m.flows}}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"sn\">ΒΗΜΑ 1</div>\n      <h2>Ροές πελατών</h2>\n      <p class=\"lead\">Οι διαδρομές βγαίνουν από την κάτοψη. Η κύρια είναι ανοιχτή· η δεύτερη και η τρίτη ανοίγουν με το + και παίρνουν βαρύτητα. Σύρε τους κόμβους για να τις διορθώσεις.</p>\n      <sc-for list=\"{{fcards}}\" as=\"f\" hint-placeholder-count=\"3\">\n        <div class=\"{{f.cls}}\">\n          <div class=\"fh\">\n            <button type=\"button\" class=\"fpick\" onClick=\"{{f.pick}}\"><i class=\"{{f.sw}}\"></i><span class=\"fn\">{{f.name}}</span></button>\n            <button type=\"button\" class=\"{{f.tcls}}\" onClick=\"{{f.tog}}\" aria-label=\"Ενεργή ροή\"></button>\n          </div>\n          <div class=\"fr\">\n            <span class=\"fs\">{{f.share}}</span>\n            <span class=\"fm\">στάσεις {{f.stops}} δλ</span>\n            <span class=\"grow\"></span>\n            <div class=\"stp\"><button type=\"button\" onClick=\"{{f.dec}}\" aria-label=\"Λιγότεροι πελάτες\">−</button><output class=\"lab\">{{f.pct}}</output><button type=\"button\" onClick=\"{{f.inc}}\" aria-label=\"Περισσότεροι πελάτες\">+</button></div>\n          </div>\n          <sc-if value=\"{{f.multi}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"fe\"><button type=\"button\" class=\"ech\" onClick=\"{{f.entPick}}\">Μπαίνει · {{f.entTxt}}</button><button type=\"button\" class=\"ech\" onClick=\"{{f.outPick}}\">Βγαίνει · {{f.outTxt}}</button></div></sc-if>\n          <sc-if value=\"{{f.own}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"fe\"><span class=\"fm\">Δική σου διαδρομή</span><span class=\"grow\"></span><button type=\"button\" class=\"ech\" onClick=\"{{f.auto}}\">Αυτόματη</button></div></sc-if>\n        </div>\n      </sc-for>\n      <sc-if value=\"{{nodeCard.on}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"ncard\">\n          <div class=\"nt\">{{nodeCard.title}}</div>\n          <div class=\"kv\"><span class=\"l\">Στάση σε αυτό το σημείο</span><div class=\"stp\"><button type=\"button\" onClick=\"{{nodeCard.dec}}\" aria-label=\"Λιγότερη στάση\">−</button><output>{{nodeCard.stop}}</output><button type=\"button\" onClick=\"{{nodeCard.inc}}\" aria-label=\"Περισσότερη στάση\">+</button></div></div>\n          <sc-if value=\"{{nodeCard.bad}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"chk bad\"><i>!</i><span>{{nodeCard.bad}}</span></div></sc-if>\n          <div class=\"btns2\"><button type=\"button\" class=\"btn line sm\" onClick=\"{{nodeCard.add}}\">+ Νέος κόμβος μετά</button><button type=\"button\" class=\"btn line sm danger\" onClick=\"{{nodeCard.del}}\">Διαγραφή κόμβου</button></div>\n        </div>\n      </sc-if>\n      <sc-if value=\"{{nodeCard.off}}\" hint-placeholder-val=\"{{ true }}\">\n        <button type=\"button\" class=\"btn line sm\" onClick=\"{{nodeCard.add}}\">+ Νέος κόμβος στη διαδρομή</button>\n      </sc-if>\n      <button type=\"button\" class=\"more\" onClick=\"{{resetAll}}\">Επαναφορά προεπιλεγμένων διαδρομών {vf.bw}}\"></u></i><em>{{vf.v}}</em></div>\n        </sc-for>\n        <div class=\"sn\" style=\"margin:2px 0 -4px\">Τι την επηρεάζει</div>\n        <sc-for list=\"{{factors}}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div class=\"fb\"><div class=\"fbl\"><b>{{f.label}}</b> <span>{{f.sub}}</span></div><i class=\"fbar\"><u class=\"{{f.cls}}\" style=\"width:{{f.bw}}\"></u></i><em>{{f.v}}</em></div>\n        </sc-for>\n        <div class=\"chk ok\"><i>i</i><span>{{vsel.insight}}</span></div>\n        <sc-if value=\"{{vsel.sug.on}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"sug\"><span>{{vsel.sug.text}}</span><button type=\"button\" class=\"btn primary sm\" onClick=\"{{vsel.sug.apply}}\">Εφάρμοσε</button></div></sc-if>\n        <sc-if value=\"{{vsel.nb}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"blks\">\n            <sc-for list=\"{{vsel.blockers}}\" as=\"b\" hint-placeholder-count=\"1\"><span class=\"bl\">{{b.text}}</span></sc-for>\n          </div>\n        </sc-if>\n        <div class=\"kv\"><span class=\"l\">Γύρισμα οθόνης</span><div class=\"stp\"><button type=\"button\" onClick=\"{{rotDec}}\" aria-label=\"Γύρνα αριστερά\">⟲</button><output>{{vsel.rot}}</output><button type=\"button\" onClick=\"{{rotInc}}\" aria-label=\"Γύρνα δεξιά\">⟳</button></div></div>\n        <div class=\"kv\"><span class=\"l\">Ύψος ματιών</span><div class=\"stp\"><button type=\"button\" onClick=\"{{eyeDec}}\" aria-label=\"Χαμηλότερα\">−</button><output>{{eyeTxt}}</output><button type=\"button\" onClick=\"{{eyeInc}}\" aria-label=\"Ψηλότερα\">+</button></div></div>\n        <button type=\"button\" class=\"more\" onClick=\"{{rotReset}}\">Επαναφορά κατεύθυνσης</button>\n      </div>\n    </sc-if>\n  </aside>\n\n  <div class=\"fl zbar\"><span class=\"hintt\">{{hint}}</span></div>\n</div>\n</div>\n\n";

      return { x: p.fcx - sd.W / 2, y: p.fcy - sd.D / 2, w: sd.W, d: sd.D, rot: p.rot || 0, badge: false, stand: p.mode === 'stand-floor', inn: 0, out: sd.D };
    }
    if (h && p.mode && this.colSide(p, h)) {

  // ---------- pointer helpers ----------

      cx.push(b.x - w, b.x + b.w, b.x, b.x + b.w - w);
      cy.push(b.y - d, b.y + b.d, b.y, b.y + b.d - d);

    cy.forEach((c) => { if (Math.abs(c - ny) <= 8 && (by === null || Math.abs(c - ny) < Math.abs(by - ny))) { by = c; } });

  // room editing (step 1)

    this._lc = { j: j, t: now };
    this._fz = this.C();

  // ---------- drop targets for positions ----------
  posTarget(d, p, inside) {
    const C = this.C(), st = this.state;
    const P = st.pos.find((q) => q.id === d.posId);
    if (!inside) { return { tgt: null, inside: false }; }
    const hits = this.hostList(st.items).filter((i) => { const lp = this.toLocal(i, p); return lp.x >= 0 && lp.x <= i.w && lp.y >= 0 && lp.y <= i.d; }).sort((a, b) => a.w * a.d - b.w * b.d);
    let h = hits[0];
    if (!h) {
      let best = 30;
      this.hostList(st.items).forEach((i) => {
        if (i.kind !== 'counter') { return; }
        const lq = this.toLocal(i, p), dx = Math.max(0, -lq.x, lq.x - i.w), dy = Math.max(0, -lq.y, lq.y - i.d), dist = Math.hypot(dx, dy);
        if (dist < best) { best = dist; h = i; }
      });
    }
    if (h && h.kind === 'counter') {
      const tmp = Object.assign({}, P, { mode: 'stand-counter', host: h.id });
      const sd = this.sdim(tmp);
      const lp0 = this.toLocal(h, p), lp = { x: this.clamp(lp0.x, 0, h.w), y: this.clamp(lp0.y, 0, h.d) };
      const dists = [['F', h.d - lp.y], ['B', lp.y], ['L', lp.x], ['R', h.w - lp.x]].sort((a, b) => a[1] - b[1]);
      const e = dists[0][0];
      const len = this.edgeLen(e, h);
      const nm = this.tpl(P.o, false).name;
      if (len < sd.W) { return { inside: true, tgt: { ok: false, msg: 'Η ' + this.edgeName(e) + ' του πάγκου είναι στενότερη από το σταντ (' + sd.W + ' εκ.)' } }; }

      const ox = this.clamp(this.s5(along - sd.W / 2), 0, len - sd.W);
      const cand = Object.assign({}, tmp, { edge: e, ox: ox });
      const bump = st.pos.find((q) => {
        if (q.id === P.id || q.host !== h.id || q.mode !== 'stand-counter' || (q.edge || 'F') !== e) { return false; }
        const w2 = this.sdim(q).W;
        return ox < q.ox + w2 && ox + sd.W > q.ox;
      });
      const f = this.standFp(cand, h);
      const clash = this.hit(this.box(f.outRect), h.id);
      const ok = !bump && !clash;
      return { inside: true, tgt: { ok: ok, mode: 'stand-counter', host: h.id, edge: e, ox: ox, fp: { x: f.cx - f.w / 2, y: f.cy - f.d / 2, w: f.w, d: f.d, rot: f.rot }, msg: bump ? 'Πέφτει πάνω στο σταντ «' + bump.name + '»' : clash ? 'Το μπροστινό μέρος πέφτει πάνω: ' + clash : 'Σταντ ' + nm + ' · πατάει στον πάγκο (' + h.name + '), βγαίνει μπροστά από την ' + this.edgeName(e) } };
    }
    const badge = (mode, msg) => {
      const f = this.fp(Object.assign({}, P, { mode: mode, host: h.id }), st.items, st.pos.filter((q) => q.id !== P.id).concat([Object.assign({}, P, { mode: mode, host: h.id })]));
      return { inside: true, tgt: { ok: true, mode: mode, host: h.id, fp: { x: f.x, y: f.y, w: f.w, d: f.d, rot: 0 }, msg: msg } };
    };
    if (h && h.kind === 'column') {
      const lq = this.toLocal(h, p), sd = [['F', h.d - lq.y], ['B', lq.y], ['L', lq.x], ['R', h.w - lq.x]].sort((a, b) => a[1] - b[1])[0][0];
      const tw = this.faceWord(this.rot(this.outVec(sd), h.r || 0));
      const other = st.pos.find((q) => q.id !== P.id && q.host === h.id && this.colSide(q, h) === sd);
      if (other) { return { inside: true, tgt: { ok: false, msg: 'Η πλευρά ' + tw + ' έχει ήδη τη θέση «' + other.name + '». Άφησέ την σε άλλη πλευρά της κολώνας.' } }; }
      const P2 = Object.assign({}, P, { mode: 'screen-only', host: h.id, ov: Object.assign({}, P.ov || {}, { side: sd }) });
      const f = this.fp(P2, st.items, st.pos);
      return { inside: true, tgt: { ok: true, mode: 'screen-only', host: h.id, side: sd, fp: { x: f.x, y: f.y, w: f.w, d: f.d, rot: 0 }, msg: 'Μόνο οθόνη στο «' + h.name + '» · πλευρά ' + tw } };
    }
    if (h && (h.kind === 'gondola' || h.kind === 'wall' || h.kind === 'rack')) { return badge('screen-only', 'Μόνο οθόνη στο «' + h.name + '»'); }
    if (h) { return { inside: true, tgt: { ok: false, msg: 'Εδώ δεν μπαίνει οθόνη' } }; }
    const tmp = Object.assign({}, P, { mode: 'stand-floor', host: null });
    const sd = this.sdim(tmp);
    const rr = P.mode === 'stand-floor' ? (P.rot || 0) : 0;
    const bb = this.box({ x: 0, y: 0, w: sd.W, d: sd.D, r: rr });
    const fcx = this.clamp(this.s5(p.x), bb.w / 2, C.RW - bb.w / 2), fcy = this.clamp(this.s5(p.y), bb.d / 2, C.RD - bb.d / 2);
    const bad = this.hit({ x: fcx - bb.w / 2, y: fcy - bb.d / 2, w: bb.w, d: bb.d }, '');
    return { inside: true, tgt: { ok: !bad, mode: 'stand-floor', host: null, fcx: fcx, fcy: fcy, rot: rr, fp: { x: fcx - sd.W / 2, y: fcy - sd.D / 2, w: sd.W, d: sd.D, rot: rr }, msg: bad ? 'Πέφτει πάνω: ' + bad : 'Σταντ ' + this.tpl(P.o, true).name + ' στο δάπεδο' } };
  }

  // ---------- room geometry edits ----------
  normRoom(pts, items, pos) {
    let mx = 1e9, my = 1e9;
    pts.forEach((p) => { if (p[0] < mx) { mx = p[0]; } if (p[1] < my) { my = p[1]; } });

    return {
      mx: mx, my: my,
      pts: pts.map((p) => [Math.round((p[0] - mx) * 10) / 10, Math.round((p[1] - my) * 10) / 10]),
      items: items.map((i) => Object.assign({}, i, { x: this.h2(i.x - mx), y: this.h2(i.y - my) })),
      pos: pos.map((q) => q.fcx !== undefined ? Object.assign({}, q, { fcx: q.fcx - mx, fcy: q.fcy - my }) : q)

    this.state.room = room;
    const items = n.items.map((i) => this.place(i));
    const pv = Object.assign({}, st.pv, { ox: st.pv.ox + n.mx * st.pv.k, oy: st.pv.oy + n.my * st.pv.k });
    const patch = Object.assign({ prev: snap, room: room, items: items, pos: n.pos.map((q) => this.fixPos(q, items)), drag: null, pv: pv }, extra || {});
    this.setState(patch);
  }
  presetShape(kind) {
    const st = this.state, B = this.roomBox(st.room.pts), w = B.RW, h = B.RD;
    const q = (v) => Math.round(v / 10) * 10;
    let pts;
    if (kind === 'L') { pts = [[0, 0], [q(w * 0.6), 0], [q(w * 0.6), q(h * 0.4)], [w, q(h * 0.4)], [w, h], [0, h]]; }
    else if (kind === 'T') { pts = [[0, 0], [w, 0], [w, q(h * 0.45)], [q(w * 0.7), q(h * 0.45)], [q(w * 0.7), h], [q(w * 0.3), h], [q(w * 0.3), q(h * 0.45)], [0, q(h * 0.45)]]; }
    else if (kind === 'C') { pts = [[0, 0], [q(w * 0.7), 0], [w, q(h * 0.3)], [w, h], [0, h]]; }
    else { pts = [[0, 0], [w, 0], [w, h], [0, h]]; }
    // entrance goes to the longest wall along the bottom
    let best = 0, bl = -1;
    pts.forEach((p, i) => { const b = pts[(i + 1) % pts.length]; if (Math.abs(p[1] - h) < 0.5 && Math.abs(b[1] - h) < 0.5) { const l = Math.abs(b[0] - p[0]); if (l > bl) { bl = l; best = i; } } });
    const door = Object.assign({}, st.door, { wi: best, c: Math.max(st.door.w / 2, bl > 0 ? bl / 2 : 100) });
    this.commitRoom(pts, 'Άλλαξε το σχήμα του χώρου', { door: door, ops: [], selW: null });
    this.setState({ pv: this.fitView(this.state.ui.focus) });
  }
  scaleRoom(key, delta) {
    const st = this.state, B = this.roomBox(st.room.pts);
    const nw = key === 'w' ? this.clamp(B.RW + delta, 200, 1500) : B.RW, nd = key === 'd' ? this.clamp(B.RD + delta, 200, 1500) : B.RD;

  // ---------- openings ----------

    return {

  // ---------- clearances (passages) ----------
  clearances() {
    const st = this.state, out = [], MIN = 90, WARN = 120;
    const list = [];
    st.items.forEach((it) => { if (it.kind === 'column') { return; } this.partBoxes(it).forEach((b) => list.push({ id: it.id, b: b })); });
    const pts = st.room.pts;
    const rect = pts.length === 4 && pts.every((p, i) => { const q = pts[(i + 1) % 4]; return Math.abs(p[0] - q[0]) < 0.5 || Math.abs(p[1] - q[1]) < 0.5; });
    const B = this.roomBox(pts);
    const mk = (x, y, w, d, gap) => { if (w > 8 && d > 8) { out.push({ x: x, y: y, w: w, d: d, gap: Math.round(gap), n: gap < MIN }); } };
    for (let a = 0; a < list.length; a++) {
      for (let b = a + 1; b < list.length; b++) {
        if (list[a].id === list[b].id) { continue; }
        const A = list[a].b, Bq = list[b].b;
        const ox0 = Math.max(A.x, Bq.x), ox1 = Math.min(A.x + A.w, Bq.x + Bq.w);
        const oy0 = Math.max(A.y, Bq.y), oy1 = Math.min(A.y + A.d, Bq.y + Bq.d);
        if (ox1 > ox0 + 8) {
          const gp = oy0 - oy1;
          if (gp >= 10 && gp < WARN) { const yy = A.y + A.d <= Bq.y ? A.y + A.d : Bq.y + Bq.d; mk(ox0, yy, ox1 - ox0, gp, gp); }
        }
        if (oy1 > oy0 + 8) {
          const gp = ox0 - ox1;
          if (gp >= 10 && gp < WARN) { const xx = A.x + A.w <= Bq.x ? A.x + A.w : Bq.x + Bq.w; mk(xx, oy0, gp, oy1 - oy0, gp); }
        }
      }
      if (rect) {
        const A = list[a].b;
        const doors = this.allOps(st.door, st.ops);
        void doors;
        if (A.x >= 10 && A.x < WARN) { mk(0, A.y, A.x, A.d, A.x); }
        if (B.RW - (A.x + A.w) >= 10 && B.RW - (A.x + A.w) < WARN) { mk(A.x + A.w, A.y, B.RW - (A.x + A.w), A.d, B.RW - (A.x + A.w)); }
        if (A.y >= 10 && A.y < WARN) { mk(A.x, 0, A.w, A.y, A.y); }
        if (B.RD - (A.y + A.d) >= 10 && B.RD - (A.y + A.d) < WARN) { mk(A.x, A.y + A.d, A.w, B.RD - (A.y + A.d), B.RD - (A.y + A.d)); }
      }
    }
    return out;
  }

  // ---------- elevation context (position view) ----------
  wv() { return { SW: 1440, SH: 984, VX: 690, MB: 150, MT: 104, FW: 760 }; }
  sides() { return [['S', 'Από τον δρόμο', { x: 0, y: 1 }], ['W', 'Από αριστερά', { x: -1, y: 0 }], ['N', 'Από το βάθος', { x: 0, y: -1 }], ['E', 'Από δεξιά', { x: 1, y: 0 }]]; }
  vctx(S, q) {
