=\"rg rgd\" d=\"{{r.d}}\" fill=\"{{r.fill}}\" stroke=\"{{r.stroke}}\" stroke-width=\"1.2\" vector-effect=\"non-scaling-stroke\" stroke-linejoin=\"round\" role=\"button\" tabindex=\"0\" aria-label=\"{{r.aria}}\" onClick=\"{{r.pick}}\"></path>\n              </sc-for>\n            </g>\n          </g>\n        </svg>\n\n        <div style=\"position: absolute; inset: 0; pointer-events: none\">\n          <sc-for list=\"{{regLabels}}\" as=\"l\" hint-placeholder-count=\"4\">\n            <span style=\"{{l.style}}\">{{l.name}}</span>\n          </sc-for>\n          <div aria-hidden=\"true\" style=\"{{gridFineStyle}}\"></div>\n          <div aria-hidden=\"true\" style=\"{{gridStyle}}\"></div>\n          <sc-for list=\"{{places}}\" as=\"q\" hint-placeholder-count=\"20\">\n            <span style=\"{{q.style}}\">{{q.name}}</span>\n          </sc-for>\n          <sc-for list=\"{{netDots}}\" as=\"n\" hint-placeholder-count=\"30\">\n            <span style=\"{{n.style}}\"></span>\n          </sc-for>\n          <sc-for list=\"{{pills}}\" as=\"b\" hint-placeholder-count=\"13\">\n            <button type=\"button\" onClick=\"{{b.pick}}\" aria-label=\"{{b.aria}}\" style=\"{{b.style}}\">\n              <span style=\"{{b.barStyle}}\"></span>\n              <b style=\"font-size: 12px; letter-spacing: -0.005em\">{{b.name}}</b><span style=\"{{b.subStyle}}\">{{b.sub}}</span>\n            </button>\n          </sc-for>\n          <sc-for list=\"{{dots}}\" as=\"d\" hint-placeholder-count=\"8\">\n            <button type=\"button\" onClick=\"{{d.pick}}\" aria-label=\"{{d.aria}}\" style=\"{{d.style}}\"><span style=\"{{d.dot}}\"></span><span style=\"{{d.labelStyle}}\"><b>{{d.name}}</b><span style=\"color: rgba(255,255,255,0.72)\">{{d.sub}}</span></span></button>\n          </sc-for>\n          <sc-for list=\"{{pins}}\" as=\"p\" hint-placeholder-count=\"8\">\n            <button type=\"button\" onClick=\"{{p.pick}}\" aria-label=\"{{p.aria}}\" aria-pressed=\"{{p.on}}\" style=\"{{p.style}}\">< isplay: flex; flex-direction: column; gap: 5px\">\n                  <div style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px\" aria-hidden=\"true\"><sc-for list=\"{{pop.strip}}\" as=\"t\" hint-placeholder-count=\"12\"><span style=\"{{t.style}}\">{{t.l}}</span></sc-for></div>\n                  <span style=\"font-size: 10px; color: #636366; line-height: 1.35\">Πράσινο: διαθέσιμο · μπλε πλαίσιο: το διάστημά σας</span>\n                </div>\n                <div style=\"display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: 10px; background: #f5f5f7\">\n                  <sc-for list=\"{{pop.scr}}\" as=\"o\" hint-placeholder-count=\"2\"><span style=\"display: flex; flex-direction: column; gap: 1px\"><b style=\"font-size: 11.5px\">{{o.t}}</b><span style=\"font-size: 11px; color: #636366\">{{o.w}}</span></span></sc-for>\n                </div>\n                <sc-if value=\"{{pop.showOpen}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" onClick=\"{{pop.open}}\" style=\"min-height: 40px; width: 100%; border: 0; border-radius: 12px; background: #0f1b3d; color: #ffffff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit\">{{pop.openLabel}}</button></sc-if>\n                <button type=\"button\" onClick=\"{{pop.listPick}}\" style=\"{{pop.listStyle}}\">{{pop.listLabel}}</button>\n              </sc-if>\n              <sc-if value=\"{{pop.inactive}}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size: 12px; color: #48484a; line-height: 1.45\">Δεν μπορείτε να κάνετε αίτημα σε αυτό το φαρμακείο ακόμα. Με την Καμπάνια Pharmaplus η προβολή σας φτάνει σε όλο το δίκτυο, και εδώ.</span>\n                <button type=\"button\" onClick=\"{{pop.goC}}\" style=\"min-height: 40px; width: 100%; border: 0; border-radius: 12px; background: #e8f0fc; color: #1a45b0; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit\">Δες την Καμπάνια Pharmaplu : 8px; color: #ffffff\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 24px; font-size: 12px; color: rgba(255,255,255,0.72); white-space: nowrap\">\n            <span style=\"display: flex; align-items: center; gap: 8px\"><b style=\"color: #ffffff\">Διάστημα προβολής</b><span>· {{mapPeriod}}</span>\n              <sc-if value=\"{{hasSel}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" onClick=\"{{clearM}}\" style=\"min-height: 24px; padding: 0 10px; border: 0; border-radius: 999px; background: rgba(255,255,255,0.16); color: #ffffff; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit\">Όλο το έτος</button></sc-if>\n            </span>\n            <b style=\"color: #9bb8ff\">{{deadLine}}</b>\n          </div>\n          <div style=\"display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px\" role=\"group\" aria-label=\"Μήνες\" onPointerLeave=\"{{mCancel}}\">\n            <sc-for list=\"{{gTiles}}\" as=\"t\" hint-placeholder-count=\"12\"><button type=\"button\" onPointerDown=\"{{t.down}}\" onPointerEnter=\"{{t.enter}}\" onPointerUp=\"{{t.up}}\" onClick=\"{{t.key}}\" aria-pressed=\"{{t.on}}\" aria-label=\"{{t.aria}}\" style=\"{{t.style}}\"><span style=\"{{t.mStyle}}\">{{t.m}}</span><span style=\"{{t.nStyle}}\">{{t.n}}</span></button></sc-for>\n          </div>\n        </div>\n      </div>\n    </sc-if>\n\n    <!-- ===================== ΔΙΑΛΕΞΕ ΦΑΡΜΑΚΕΙΟ · ΚΑΡΤΕΛΑ ===================== -->\n    <sc-if value=\"{{vPharm}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"scr\" style=\"flex: 1; overflow-y: auto; padding: 24px 36px 32px; display: flex; flex-direction: column; gap: 18px\">\n        <button type=\"button\" onClick=\"{{backMap}}\" style=\"align-self: flex-start; min-height: 30px; padding: 0; border: 0; background: transparent; color: #636366; font-size: 13px; font-weight: 600; cursor: pointer\">‹ Πίσω στον χάρτη</button>\n\n        <sc-if value=\"{{phSoon0}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start\">\n            <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0\">\n                            <div style=\"padding: 30px 28px; border-radius: 20px; background: #ffffff; border: 2px dashed rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 10px\">\n                <b style=\"font-size: 18px; letter-spacing: -0.01em\">Αυτό το φαρμακείο δεν είναι ανοιχτό στο Market</b>\n                <span style=\"font-size: 14px; line-height: 1.55; color: #48484a; max-width: 560px\">Το φαρμακείο δεν έχει ανοίξει ακόμα το «Φαίνεται στις εταιρίες στο SpaceCoLLab Market». Το βλέπετε στον χάρτη, αλλά δεν μπορείτε να το βάλετε στη λίστα σας ούτε να ζητήσετε θέση εδώ.</span>\n              </div>\n            </div>\n            <aside style=\"display: flex; flex-direction: column; gap: 14px\">\n              <button type=\"button\" onClick=\"{{goCentral}}\" style=\"display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 18px 20px; border: 0; border-radius: 20px; background: #e8f0fc; color: #1a45b0; cursor: pointer; text-align: left; font-family: inherit; box-shadow: inset 0 0 0 1.5px #2459e0\"><b style=\"font-size: 14px\">Θέλετε να φτάσετε και σε αυτό;</b><span style=\"font-size: 13px; line-height: 1.45\">Η Καμπάνια Pharmaplus παίζει σε όλο το δίκτυο, ακόμα και στα φαρμακεία που δεν συμμετέχουν στον χάρτη. ›</span></button>\n            </aside>\n          </div>\n        </sc-if>\n\n        <sc-if value=\"{{phProf}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"{{cardStyle}}\">\n            <div style=\"display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start\">\n              <div style=\"display: flex; flex-direction: column; gap: 12px; min-width: 0\">\n                <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #636366\">ΠΡΟΦΙΛ ΦΑΡΜΑΚΕΙΟΥ</span>\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 10px\">\n                  <sc-for list=\"{{pfFacts}}\" as=\"f\" hint-placeholder-count=\"2\"><div style=\"padding: 12px 14px; border-radius: 14px; background: #f5f5f7; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 11.5px; color: #636366\">{{f.k}}</span><b style=\"font-size: 17px; letter-spacing: -0.01em\">{{f.v}}</b><span style=\"font-size: 11.5px; color: #8e8e93; line-height: 1.35\">{{f.n}}</span></div></sc-for>\n                </div>\n                <sc-if value=\"{{pfNearOn}}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display: flex; gap: 10px; font-size: 13.5px; line-height: 1.45\"><b style=\"flex: none\">Κοντά:</b><span style=\"color: #48484a\">{{pfNear}}</span></div></sc-if>\n                <div style=\"padding: 14px 16px; border-radius: 14px; background: #eef2fb; display: flex; flex-direction: column; gap: 3px\"><span style=\"font-size: 11.5px; font-weight: 700; color: #1a45b0\">Τι μπορείτε να κλείσετε εδώ</span><b style=\"font-size: 16px; letter-spacing: -0.01em\">{{pfCan}}</b></div>\n              </div>\n            </div>\n          </div>\n          <div role=\"tablist\" aria-label=\"Τι κλείνετε σε αυτό το φαρμακείο\" style=\"display: flex; gap: 10px\">\n            <sc-for list=\"{{pfTabs}}\" as=\"t\" hint-placeholder-count=\"2\"><button type=\"button\" role=\"tab\" aria-selected=\"{{t.on}}\" onClick=\"{{t.pick}}\" style=\"{{t.style}}\"><b style=\"font-size: 16px\">{{t.label}}</b><span style=\"{{t.subStyle}}\">{{t.sub}}</span></button></sc-for>\n          </div>\n        </sc-if>\n\n        <sc-if value=\"{{ph3d}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"{{cardStyle}}\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap\"><b style=\"font-size: 17px; letter-spacing: -0.01em\">Το φαρμακείο σε 3D</b><span style=\"font-size: 13px; color: #636366\">Ανοίγει στη γωνία που έχει ορίσει η Pharmaplus</span></div>\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n              <span style=\"font-size: 12px; font-weight: 700; color: #48484a\">{{p3Lbl}}</span>\n              <sc-for list=\"{{p3Chips}}\" as=\"c\" hint-placeholder-count=\"3\"><button type=\"button\" onClick=\"{{c.pick}}\" style=\"{{c.style}}\"><span aria-hidden=\"true\" style=\"{{c.dot}}\"></span>{{c.t}}</button></sc-for>\n              <span style=\"margin-left: auto; padding: 6px 12px; border-radius: 999px; background: #eef2fb; color: #1a45b0; font-size: 12px; font-weight: 700\">Μάτια πελάτη: κουμπί «Από την είσοδο» μέσα στο 3D</span>\n            </div>\n            <div id=\"p3host\" data-raw=\"1\" data-code=\"{{p3Code}}\" data-title=\"3D φαρμακείου\" data-css=\"display: block; width: 100%; height: 660px; border: 0; border-radius: 16px; background: #f5f5f7; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1)\"></div>\n            <span style=\"font-size: 12px; color: #636366; line-height: 1.45\">Σύρετε για περιστροφή, ρόδα για ζουμ. Τα χρώματα διαθεσιμότητας φαίνονται στις ετικέτες πάνω από το 3D· πατήστε μια ετικέτα για να ανοίξει η θέση πιο κάτω.</span>\n          </div>\n        </sc-if>\n\n        <sc-if value=\"{{phScr}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start\">\n            <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0\">\n                            <div style=\"{{cardStyle}}\">\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px\"><b style=\"font-size: 17px; letter-spacing: -0.01em\">Διαλέξτε θέση και μήνες</b><span style=\"font-size: 13px; color: #636366\">{{phPrice}} · {{phAvail}} · {{phPos}}</span></div>\n                <div style=\"display: grid; grid-template-columns: 112px repeat(12, minmax(0, 1fr)); gap: 6px; align-items: center\">\n                  <span></span>\n                  <sc-for list=\"{{mhead}}\" as=\"h\" hint-placeholder-count=\"12\"><span style=\"text-align: center; font-size: 11px; font-weight: 700; color: #636366\">{{h}}</span></sc-for>\n                </div>\n                <sc-for list=\"{{phRowsPos}}\" as=\"r\" hint-placeholder-count=\"2\">\n                  <div style=\"{{r.metaStyle}}\"><b style=\"font-size: 14px\">{{r.name}}</b><span style=\"padding: 2px 9px; border-radius: 999px; background: #0f1b3d; color: #ffffff; font-size: 11px; font-weight: 700\">{{r.kind}}</span><span style=\"padding: 2px 9px; border-radius: 999px; background: #e8f0fc; color: #1a45b0; font-size: 11px; font-weight: 700\">{{r.orient}}</span><span style=\"font-size: 12px; color: #48484a; line-height: 1.4\">{{r.meta}}</span></div>\n                  <div style=\"display: grid; grid-template-columns: 112px repeat(12, minmax(0, 1fr)); gap: 6px; align-items: center\">\n                    <span style=\"font-size: 11px; color: #636366; line-height: 1.3\">Ελεύθεροι μήνες</span>\n                    <sc-for list=\"{{r.cells}}\" as=\"c\" hint-placeholder-count=\"12\"><button type=\"button\" onClick=\"{{c.pick}}\" aria-label=\"{{c.aria}}\" aria-pressed=\"{{c.on}}\" style=\"{{c.style}}\">{{c.text}}</button></sc-for>\n                  </div>\n                </sc-for>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: #48484a\">\n                  <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\" style=\"width: 14px; height: 14px; border-radius: 4px; background: #e3f4ea; box-shadow: inset 0 0 0 1.5px #168454\"></span>Διαθέσιμο</span>\n                  <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\" style=\"width: 14px; height: 14px; border-radius: 4px; background: #ececf0\"></span>Κλεισμένο</span>\n                  <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\" style=\"width: 14px; height: 14px; border-radius: 4px; background: #fff4d6; box-shadow: inset 0 0 0 1.5px #c58a00\"></span>Το αίτημά σας (περιμένει)</span>\n                  <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\" style=\"width: 14px; height: 14px; border-radius: 4px; background: #0f1b3d\"></span>Δική σας κράτηση</span>\n                </div>\n                <sc-if value=\"{{phPromoOn}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 10px; border-radius: 12px; background: #f5f5f7; opacity: 0.75\"><b style=\"font-size: 14px\">Θέση Promotion</b><span style=\"padding: 2px 9px; border-radius: 999px; background: #636366; color: #ffffff; font-size: 11px; font-weight: 700\">Promotion</span><span style=\"padding: 2px 9px; border-radius: 999px; background: #ececf0; color: #48484a; font-size: 11px; font-weight: 700\">Κάθετη · γόνδολα</span><span style=\"font-size: 12px; color: #48484a\">Οι θέσεις Promotion (γόνδολα ή κολώνα) ανοίγουν αργότερα.</span></div></sc-if>\n                <span style=\"font-size: 12px; color: #636366; line-height: 1.45\">Βλέπετε τις θέσεις που έχει το φαρμακείο. Η τιμή είναι του φαρμακείου και δεν αλλάζει από εδώ· για άλλη τιμή μιλήστε απευθείας με το φαρμακείο.</span>\n              </div>\n            </div>\n            <aside style=\"display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"padding: 20px 22px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 12px 32px rgba(10,20,50,0.10); display: flex; flex-direction: column; gap: 14px\">\n                <b style=\"font-size: 17px; letter-spacing: -0.01em\">Το αίτημά σας</b>\n                <sc-if value=\"{{pcEmpty}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 13px; color: #636366; line-height: 1.5\">Πατήστε τους διαθέσιμους μήνες που σας ενδιαφέρουν. {{phLastReq}}. Ένας μήνας δεν φαίνεται ελεύθερος αν το φαρμακείο έχει ήδη συμφωνία, προσυμφωνία ή χορηγία ραφιών.</span></sc-if>\n                <sc-if value=\"{{pcFull}}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: flex; flex-direction: column; gap: 8px\">\n                    <sc-for list=\"{{pcLines}}\" as=\"l\" hint-placeholder-count=\"2\"><span style=\"display: flex; justify-content: space-between; gap: 10px; font-size: 13px; line-height: 1.4\"><span>{{l.t}}</span><b style=\"white-space: nowrap\">{{l.v}}</b></span></sc-for>\n                    <span style=\"display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.1)\"><span style=\"font-size: 13px; color: #636366\">Σύνολο</span><b style=\"font-size: 28px; letter-spacing: -0.02em\">{{pcTotal}}</b></span>\n                    <span style=\"font-size: 12px; color: #1a45b0; font-weight: 600\">{{phLastReq}}</span>\n                  </div>\n                </sc-if>\n                <button type=\"button\" onClick=\"{{sendReq}}\" style=\"{{sendReqStyle}}\">Συνεχίστε στη μάρκα και τα προϊόντα ›</button>\n                <button type=\"button\" onClick=\"{{pfAddPick}}\" style=\"{{pfAddStyle}}\">{{pfAddLbl}}</button>\n                <span style=\"font-size: 12px; font-weight: 600; color: #48484a\">{{vat}}</span>\n                <span style=\"font-size: 12px; color: #636366; line-height: 1.45\">Το φαρμακείο απαντά μέσα σε 7 ημέρες (αν στείλετε σήμερα, μέχρι {{answerBy}}). Αν δεν δεχτεί ή δεν απαντήσει, δεν πληρώνετε.</span>\n              </div>\n              <sc-if value=\"{{phCompOn}}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding: 16px 18px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 10px\">\n                  <b style=\"font-size: 14px\">{{phCompTitle}}</b>\n                  <span style=\"font-size: 12px; color: #636366; line-height: 1.4\">Τι ποσοστό των κλεισμένων θέσεων της περιοχής έχει κάθε εταιρία, για όλο το 2027.</span>\n                  <sc-for list=\"{{phCompRows}}\" as=\"c\" hint-placeholder-count=\"4\"><span style=\"display: flex; justify-content: space-between; font-size: 13px\"><span>{{c.name}}</span><b>{{c.pct}}</b></span></sc-for>\n                </div>\n              </sc-if>\n              <sc-if value=\"{{phCompFew}}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding: 16px 18px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 6px\">\n                  <b style=\"font-size: 14px\">Μερίδιο προβολής στην περιοχή</b>\n                  <span style=\"font-size: 12px; color: #636366; line-height: 1.45\">Λίγα φαρμακεία στην περιοχή για μερίδιο προβολής (χρειάζονται τουλάχιστον 5).</span>\n                </div>\n              </sc-if>\n              <button type=\"button\" onClick=\"{{goCentral}}\" style=\"display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 16px 18px; border: 0; border-radius: 20px; background: #e8f0fc; color: #1a45b0; cursor: pointer; text-align: left; font-family: inherit\"><b style=\"font-size: 14px\">Δεν θέλετε να διαλέξετε μόνοι σας;</b><span style=\"font-size: 13px; line-height: 1.45\">Η Pharmaplus μπορεί να κλείσει προβολή σε όλο το δίκτυο ή σε πολλά φαρμακεία μαζί, και πληρώνετε μόνο για όσα δεχτούν. ›</span></button>\n            </aside>\n          </div>\n        </sc-if>\n\n        <sc-if value=\"{{phVit}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start\">\n            <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0\">\n              <div style=\"{{cardStyle}}\">\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px\"><b style=\"font-size: 17px; letter-spacing: -0.01em\">Η βιτρίνα</b><span style=\"font-size: 13px; color: #636366\">{{vfSub}}</span></div>\n                <sc-if value=\"{{vfacOn}}\" hint-placeholder-val=\"{{ false }}\"><div role=\"group\" aria-label=\"Όψη\" style=\"display: flex; flex-wrap: wrap; gap: 6px\"><sc-for list=\"{{vfacOpts}}\" as=\"s\" hint-placeholder-count=\"2\"><button type=\"button\" onClick=\"{{s.pick}}\" aria-pressed=\"{{s.on}}\" style=\"{{s.style}}\">{{s.label}}</button></sc-for></div></sc-if>\n                <div style=\"display: flex; flex-direction: column\">\n                  <sc-if value=\"{{vfNone}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"align-self: center; padding: 40px 0; font-size: 14px; color: #48484a\">Αυτό το φαρμακείο δεν έχει βιτρίνα για καμπάνιες.</span></sc-if>\n                  <div style=\"position: relative; overflow-x: auto; border-radius: 12px\"><div id=\"scl331Host\" data-raw=\"1\"><div id=\"scl331Out\"></div></div></div>\n                </div>\n                <div role=\"group\" aria-label=\"Εμπορικές θέσεις της όψης\" style=\"display: flex; flex-wrap: wrap; gap: 6px\"><sc-for list=\"{{vdChips}}\" as=\"c\" hint-placeholder-count=\"3\"><button type=\"button\" onClick=\"{{c.pick}}\" aria-pressed=\"{{c.on}}\" style=\"{{c.style}}\"><b style=\"{{c.num}}\">{{c.n}}</b>{{c.t}}</button></sc-for></div>\n                <span style=\"font-size: 12px; color: #636366; line-height: 1.45\">{{vfNote}}</span>\n                <sc-if value=\"{{vWholeOn}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" onClick=\"{{vWholePick}}\" style=\"align-self: flex-start; min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #168454; color: #ffffff; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit\">{{vWholeLbl}}</button></sc-if>\n                <sc-if value=\"{{vWholeOff}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 12px; color: #8e8e93; line-height: 1.45\">{{vWholeNo}}</span></sc-if>\n                <sc-if value=\"{{vdOn}}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 14px; background: #f5f7fb; box-shadow: inset 0 0 0 1.5px #2459e0\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\"><b style=\"font-size: 15px\">{{vdName}}</b><span style=\"{{vdStStyle}}\">{{vdSt}}</span></div>\n                    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px\">\n                      <sc-for list=\"{{vdFacts}}\" as=\"f\" hint-placeholder-count=\"6\"><span style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 13px; line-height: 1.4\"><span style=\"color: #636366; flex: none\">{{f.k}}</span><b style=\"text-align: right\">{{f.v}}</b></span></sc-for>\n                    </div>\n                    <button type=\"button\" onClick=\"{{pfAddPick}}\" style=\"{{pfAddStyle}}\">{{pfAddLbl}}</button>\n                  </div>\n                </sc-if>\n              </div>\n              <div style=\"{{cardStyle}}\">\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px\"><b style=\"font-size: 17px; letter-spacing: -0.01em\">Διαλέξτε θέση και μήνες</b><span style=\"font-size: 13px; color: #636366\">{{vfCount}}</span></div>\n                <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px\">\n                  <span style=\"font-size: 12px; font-weight: 700; color: #48484a; margin-right: 4px\">Το υλικό μου:</span>\n                  <sc-for list=\"{{vfMatOpts}}\" as=\"s\" hint-placeholder-count=\"4\"><button type=\"button\" onClick=\"{{s.pick}}\" aria-pressed=\"{{s.on}}\" style=\"{{s.style}}\">{{s.label}}</button></sc-for>\n                </div>\n                <sc-for list=\"{{vfRows}}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <div style=\"{{r.rowStyle}}\">\n                    <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n                      <b style=\"font-size: 14px\">{{r.name}}</b><span style=\"font-size: 12.5px; color: #48484a\">{{r.dims}}</span><span style=\"{{r.stgStyle}}\">{{r.stg}}</span><span style=\"{{r.fitStyle}}\">{{r.fitTxt}}</span>\n                    </div>\n                    <div style=\"display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 5px\">\n                      <sc-for list=\"{{r.cells}}\" as=\"c\" hint-placeholder-count=\"12\"><button type=\"button\" onClick=\"{{c.pick}}\" aria-label=\"{{c.aria}}\" aria-pressed=\"{{c.on}}\" style=\"{{c.style}}\">{{c.text}}</button></sc-for>\n                    </div>\n                  </div>\n                </sc-for>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: #48484a\">\n                  <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\" style=\"width: 14px; height: 14px; border-radius: 4px; background: #e3f4ea; box-shadow: inset 0 0 0 1.5px #168454\"></span>Διαθέσιμο</span>\n                  <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\" style=\"width: 14px; height: 14px; border-radius: 4px; background: #ececf0\"></span>Κλεισμένο ή δεν χωράει</span>\n                  <span style=\"display: inline-flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\" style=\"width: 14px; height: 14px; border-radius: 4px; background: #168454\"></span>Επιλεγμένο</span>\n                </div>\n                <sc-if value=\"{{vfWarn}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding: 10px 12px; border-radius: 12px; background: #fff4d6; color: #7a4b00; font-size: 12px; line-height: 1.45; box-shadow: inset 0 0 0 1.5px #c58a00\">Σε μία ή περισσότερες θέσεις τα μέτρα είναι εκτίμηση. Για συμφωνία με προμηθευτή χρειάζονται επιβεβαιωμένα μέτρα.</span></sc-if>\n              </div>\n            </div>\n            <aside style=\"display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"padding: 20px 22px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 12px 32px rgba(10,20,50,0.10); display: flex; flex-direction: column; gap: 14px\">\n                <b style=\"font-size: 17px; letter-spacing: -0.01em\">Το αίτημά σας</b>\n                <sc-if value=\"{{pcEmpty}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 13px; color: #636366; line-height: 1.5\">Πατήστε τους διαθέσιμους μήνες σε μια θέση που χωράει το υλικό σας. {{phLastReq}}.</span></sc-if>\n                <sc-if value=\"{{pcFull}}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: flex; flex-direction: column; gap: 8px\">\n                    <sc-for list=\"{{pcLines}}\" as=\"l\" hint-placeholder-count=\"2\"><span style=\"display: flex; justify-content: space-between; gap: 10px; font-size: 13px; line-height: 1.4\"><span>{{l.t}}</span><b style=\"white-space: nowrap; color: #b27600\">{{l.v}}</b></span></sc-for>\n                    <span style=\"display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.1)\"><span style=\"font-size: 13px; color: #636366\">Σύνολο</span><b style=\"font-size: 24px; letter-spacing: -0.02em; color: #b27600\">{{pcTotal}}</b></span>\n                    <span style=\"font-size: 12px; color: #1a45b0; font-weight: 600\">{{phLastReq}}</span>\n                  </div>\n                </sc-if>\n                <button type=\"button\" onClick=\"{{sendReq}}\" style=\"{{sendReqStyle}}\">Συνεχίστε στη μάρκα και τα προϊόντα ›</button>\n                <button type=\"button\" onClick=\"{{pfAddPick}}\" style=\"{{pfAddStyle}}\">{{pfAddLbl}}</button>\n                <span style=\"font-size: 12px; font-weight: 600; color: #48484a\">{{vat}}</span>\n                <span style=\"font-size: 12px; color: #636366; line-height: 1.45\">Η τιμή είναι ενδεικτική και οριστικοποιείται μετά τη μελέτη. Το φαρμακείο απαντά μέσα σε 7 ημέρες (αν στείλετε σήμερα, μέχρι {{answerBy}}). Αν δεν δεχτεί ή δεν απαντήσει, δεν πληρώνετε.</span>\n              </div>\n              <div style=\"padding: 16px 18px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 8px\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\"><b style=\"font-size: 14px\">Κίνηση στον δρόμο</b><span style=\"{{vfWalkBadgeStyle}}\">{{vfWalkBadge}}</span></div>\n                <b style=\"font-size: 22px; letter-spacing: -0.02em\">{{vfWalk}}</b>\n                <span style=\"font-size: 12px; color: #636366; line-height: 1.45\">περαστικοί την ημέρα.</span>\n              </div>\n              <div style=\"padding: 16px 18px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 8px\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\"><b style=\"font-size: 14px\">Η όψη στον δρόμο</b><span style=\"padding: 2px 9px; border-radius: 999px; background: #ececf0; color: #48484a; font-size: 10.5px; font-weight: 700\">ενδεικτικά</span></div>\n                <svg viewBox=\"0 0 300 150\" width=\"100%\" role=\"img\" aria-label=\"Μικρός χάρτης γειτονιάς με τη θέση της όψης\" style=\"display: block; border-radius: 12px; background: #eef0f4\">\n                  <rect x=\"0\" y=\"100\" width=\"300\" height=\"20\" fill=\"#ffffff\"></rect><rect x=\"196\" y=\"0\" width=\"16\" height=\"150\" fill=\"#ffffff\"></rect><rect x=\"88\" y=\"0\" width=\"12\" height=\"100\" fill=\"#ffffff\"></rect>\n                  <rect x=\"8\" y=\"10\" width=\"72\" height=\"82\" rx=\"4\" fill=\"#dfe2e8\"></rect><rect x=\"220\" y=\"10\" width=\"72\" height=\"82\" rx=\"4\" fill=\"#dfe2e8\"></rect><rect x=\"8\" y=\"128\" width=\"180\" height=\"16\" rx=\"4\" fill=\"#dfe2e8\"></rect><rect x=\"220\" y=\"128\" width=\"72\" height=\"16\" rx=\"4\" fill=\"#dfe2e8\"></rect>\n                  <rect x=\"108\" y=\"40\" width=\"84\" height=\"56\" rx=\"4\" fill=\"#c7d3ea\" stroke=\"#8fa3cc\" stroke-width=\"1\"></rect>\n                  <line x1=\"{{vmX1}}\" y1=\"{{vmY1}}\" x2=\"{{vmX2}}\" y2=\"{{vmY2}}\" stroke=\"#2459e0\" stroke-width=\"5\" stroke-linecap=\"round\"></line>\n                  <circle cx=\"150\" cy=\"66\" r=\"8\" fill=\"#0f1b3d\" stroke=\"#ffffff\" stroke-width=\"2.5\"></circle>\n                </svg>\n                <span style=\"font-size: 12.5px; font-weight: 700\">{{vmStreet}}</span>\n                <span style=\"font-size: 12px; color: #636366; line-height: 1.45\">{{vfNear}}</span>\n              </div>\n            </aside>\n          </div>\n        </sc-if>\n      </div>\n    </sc-if>\n\n    <!-- ===================== ΚΛΕΙΣΕ ΜΕΣΩ ΚΕΝΤΡΙΚΩΝ ===================== -->\n    <sc-if value=\"{{vCentral}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"scr\" style=\"flex: 1; overflow-y: auto; padding: 24px 36px 32px; display: flex; flex-direction: column; gap: 20px\">\n        \n\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap\">\n          <div style=\"display: flex; align-items: center; gap: 14px; flex-wrap: wrap\">\n            <div role=\"group\" aria-label=\"Τι διαφημίζετε\" style=\"display: flex; gap: 3px; padding: 3px; border-radius: 14px; background: #e4e4ea\">\n              <sc-for list=\"{{cToolOpts}}\" as=\"t\" hint-placeholder-count=\"2\"><button type=\"button\" onClick=\"{{t.pick}}\" aria-pressed=\"{{t.on}}\" style=\"{{t.style}}\">{{t.label}}</button></sc-for>\n            </div>\n            <span style=\"font-size: 13px; color: #636366; line-height: 1.4\">{{cNote}}</span>\n          </div>\n          <button type=\"button\" onClick=\"{{goMap}}\" style=\"min-height: 38px; padding: 0 16px; border: 0; border-radius: 12px; background: #e8f0fc; color: #1a45b0; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit\">Θέλετε να διαλέξετε εσείς; Ανοίξτε τον χάρτη ›</button>\n        </div>\n\n        <!-- Καμπάνια Pharmaplus -->\n        <sc-if value=\"{{ppSecOn}}\" hint-placeholder-val=\"{{ true }}\">\n        <section style=\"padding: 22px 24px; border-radius: 22px; background: #dcf1f0; box-shadow: inset 0 0 0 1.5px #00888a; display: flex; flex-direction: column; gap: 16px; color: #004d4f\">\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n              <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #006b6d\">ΚΑΜΠΑΝΙΑ PHARMAPLUS · ΟΛΟ ΤΟ ΔΙΚΤΥΟ</span>\n              <b style=\"font-size: 24px; letter-spacing: -0.02em; line-height: 1.15\">Από 100 € ανά φαρμακείο και μήνα</b>\n              <span style=\"font-size: 14px; line-height: 1.5; max-width: 640px\">Η προβολή σας παίζει στη Θέση Pharmaplus (η δική μας θέση πάγκου σε κάθε φαρμακείο), σε όλο το δίκτυο, χωρίς να περιμένετε απάντηση από φαρμακεία. Δεν κλείνεται από εδώ: μιλάτε με την Pharmaplus και συμφωνείτε τιμή και διαφημιστικό αρχείο.</span>\n            </div>\n            <div style=\"display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 240px\">\n              <sc-if value=\"{{ppNotSent}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" onClick=\"{{openPP}}\" style=\"{{ppBtn}}\">Μιλήστε με την Pharmaplus</button></sc-if>\n              <sc-if value=\"{{ppOpen}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" onClick=\"{{closePP}}\" style=\"{{ppBtn2}}\">Κλείσιμο φόρμας</button></sc-if>\n              <sc-if value=\"{{ppSent}}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size: 13px; font-weight: 700; color: #006b6d; line-height: 1.4\">✓ {{ppSentLine}}</span>\n                <button type=\"button\" onClick=\"{{goBook}}\" style=\"{{ppBtn2}}\">Δείτε το στα αιτήματά μου</button>\n              </sc-if>\n            </div>\n          </div>\n          <sc-if value=\"{{ppOpen}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: 18px 20px; border-radius: 16px; background: #ffffff; color: #1d1d1f; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; flex-direction: column; gap: 8px\">\n                <b style=\"font-size: 14px\">Ποιους μήνες σας ενδιαφέρουν; <span style=\"font-weight: 500; color: #636366\">(προαιρετικό)</span></b>\n                <div style=\"display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px\" role=\"group\" aria-label=\"Μήνες ενδιαφέροντος\">\n                  <sc-for list=\"{{ppMonths}}\" as=\"m\" hint-placeholder-count=\"12\"><button type=\"button\" onClick=\"{{m.pick}}\" aria-pressed=\"{{m.on}}\" aria-label=\"{{m.aria}}\" style=\"{{m.style}}\">{{m.m}}</button></sc-for>\n                </div>\n              </div>\n              <div style=\"display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px\">\n                <label style=\"display: flex; flex-direction: column; gap: 5px\"><span style=\"font-size: 12px; font-weight: 700; color: #48484a\">Τηλέφωνο επικοινωνίας</span><input type=\"text\" value=\"{{ppPhone}}\" onInput=\"{{setPPPhone}}\" style=\"{{inStyle}}\"></label>\n                <label style=\"display: flex; flex-direction: column; gap: 5px\"><span style=\"font-size: 12px; font-weight: 700; color: #48484a\">Μήνυμα προς την Pharmaplus</span><input type=\"text\" value=\"{{ppMsg}}\" onInput=\"{{setPPMsg}}\" style=\"{{inStyle}}\"></label>\n              </div>\n              <div style=\"display: flex; align-items: center; gap: 16px\">\n                <button type=\"button\" onClick=\"{{sendPP}}\" style=\"{{ppBtn}}\">Αποστολή στην Pharmaplus</button>\n                <span style=\"font-size: 12px; color: #636366; line-height: 1.45\">Η Pharmaplus θα επικοινωνήσει μαζί σας με την τιμή και τις λεπτομέρειες. Δεν χρεώνεστε από αυτή τη φόρμα.</span>\n              </div>\n            </div>\n          </sc-if>\n        </section>\n        </sc-if>\n\n        <sc-if value=\"{{vbOn}}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"padding: 22px 24px; border-radius: 22px; background: #eef8f7; box-shadow: inset 0 0 0 1.5px #00888a; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #006b6d\">BUNDLE ΒΙΤΡΙΝΑΣ ΜΕ ΠΑΡΑΓΩΓΗ PHARMAPLUS</span>\n            <b style=\"font-size: 24px; letter-spacing: -0.02em; color: #0b3b3c\">Αναλαμβάνουμε εμείς παραγωγή και τοποθέτηση</b>\n            <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45; color: #1d1d1f\">\n              <span style=\"display: flex; gap: 10px\"><b style=\"color: #00888a\">✓</b>Ενεργοποίηση: 500 € ανά 50 φαρμακεία, κάθε μήνα</span>\n              <span style=\"display: flex; gap: 10px\"><b style=\"color: #00888a\">✓</b>Παραγωγή και τοποθέτηση: με προσφορά από τα specs σας</span>\n            </div>\n            <span style=\"font-size: 12px; color: #006b6d\">{{vat}} Δεν κλείνει από εδώ: στέλνετε specs και η Pharmaplus απαντά με προσφορά.</span>\n          </div>\n          <div style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 8px\">\n            <sc-if value=\"{{vbNot}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" onClick=\"{{vbSend}}\" style=\"min-height: 50px; padding: 0 22px; border: 0; border-radius: 14px; background: #007a7c; color: #ffffff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit\">Στείλτε specs στην Pharmaplus</button></sc-if>\n            <sc-if value=\"{{vbSent}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding: 10px 16px; border-radius: 999px; background: #dcf1f0; color: #006b6d; font-size: 13px; font-weight: 700\">Στάλθηκε · περιμένετε τη φόρμα specs</span></sc-if>\n          </div>\n        </section>\n        </sc-if>\n\n        <!-- Προβολή σε πολλά φαρμακεία -->\n        <div style=\"display: flex; flex-direction: column; gap: 4px; padding-top: 4px\">\n          <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #1a45b0\">ΕΠΙΛΕΓΜΕΝΑ ΦΑΡΜΑΚΕΙΑ</span>\n          <span style=\"font-size: 20px; font-weight: 700; letter-spacing: -0.02em\">Προβολή σε πολλά φαρμακεία, με απάντηση από το καθένα</span>\n          <span style=\"font-size: 14px; color: #636366; line-height: 1.5; max-width: 760px\">Διαλέξτε πού και πότε και στείλτε ένα αίτημα σε πολλά φαρμακεία μαζί, σε ειδική τιμή Pharmaplus, χαμηλότερη από την τιμή του φαρμακείου.</span>\n        </div>\n\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start\">\n          <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0\">\n            <section style=\"{{cardStyle}}\">\n              <div style=\"display: flex; align-items: center; gap: 10px\"><span aria-hidden=\"true\" style=\"width: 26px; height: 26px; border-radius: 13px; background: #0f1b3d; color: #ffffff; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">1</span><b style=\"font-size: 17px; letter-spacing: -0.01em\">Πού να παίξει;</b></div>\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px\" role=\"group\" aria-label=\" lign-items: baseline; gap: 8px\"><span style=\"font-size: 11px; color: #006b6d; font-weight: 600\">Pharmaplus</span><b style=\"font-size: 15px; font-variant-numeric: tabular-nums\">{{r.price}}</b></span>\n                      <span style=\"{{r.ownRow}}\"><span style=\"font-size: 11px; color: #8e8e93\">Απευθείας</span><span style=\"font-size: 13px; color: #6e6e73; font-variant-numeric: tabular-nums\">{{r.own}}</span></span>\n                      <span style=\"{{r.onlyStyle}}\">Μόνο Pharmaplus</span>\n                    </span>\n                  </div>\n                </sc-for>\n                <span style=\"padding: 10px 0 4px; font-size: 12px; color: #6e6e73\">{{netMore}}</span>\n              </div>\n            </section>\n          </div>\n\n          <aside style=\"position: sticky; top: 0; display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 18px 44px rgba(10,20,50,0.14)\">\n            <div style=\"padding: 22px 24px; background: radial-gradient(120% 150% at 100% 0%, rgba(84,132,255,0.45) 0%, rgba(84,132,255,0) 52%), linear-gradient(155deg, #1a2a52 0%, #0b1431 100%); color: #ffffff; display: flex; flex-direction: column; gap: 8px\">\n              <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; opacity: 0.85\">Η ΠΡΟΤΑΣΗ ΓΙΑ ΕΣΑΣ</span>\n              <span style=\"font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05\">{{sumTotal}}</span>\n              <span style=\"font-size: 14px; line-height: 1.4; opacity: 0.94\">{{sumLine}}</span>\n            </div>\n            <div style=\"padding: 16px 22px 14px; display: flex; flex-direction: column; gap: 10px\">\n              <div style=\"{{bdAShow}}\"><span style=\"display: flex; flex-direction: column; gap: 1px\"><b style=\"font-size: 14px\">{{bdAN}}</b><span style=\"font-size: 12px; color: #6e6e73\">{{bdASub}}</span></span><b style=\"font-size: 16px; font-variant-numeric:
