<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>SpaceCoLLab Market</title>
<style>
:root{--ink:#1d1d1f;--ink2:#3a3a3c;--muted:#6e6e73;--faint:#86868b;--bg:#f5f5f7;--surface:#fff;--fill:#f2f2f5;--fill2:#e8e8ed;--line:rgba(0,0,0,.1);--accent:#2459e0;--accent-ink:#1a45b8;--accent-soft:#e8efff;--ok:#168454;--ok-soft:#e3f4ea;--ok-ink:#14633b;--navy:#0a1230;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
/* κεφαλίδα */
.hd{flex:none;height:60px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--surface);box-shadow:0 1px 0 rgba(0,0,0,.08);position:relative;z-index:30}
.logo{display:flex;align-items:baseline;gap:7px;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.logo span{font-weight:300;letter-spacing:.02em}.logo span i{font-style:normal;font-weight:700}
.logo b{font-weight:700;color:var(--accent)}
.nav{display:flex;gap:4px;margin-left:10px;overflow:auto}
.nav button{border:0;background:none;border-radius:980px;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav button[aria-current="page"]{background:var(--fill);color:var(--ink);font-weight:600}
.nav button:disabled{cursor:default;color:var(--faint)}
.soon{font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:980px;background:var(--fill2);color:var(--muted)}
.grow{flex:1}
.who{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.who b{color:var(--ink);font-weight:600}
/* χάρτης */
.map{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--navy);color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.map .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 55% at 40% 46%,rgba(70,110,240,.32),rgba(70,110,240,0) 72%),radial-gradient(circle,rgba(255,255,255,.07) 1px,rgba(255,255,255,0) 1.4px) 0 0/26px 26px,linear-gradient(165deg,#16255a 0%,#0a1230 100%)}
.map>svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.map.drag>svg{cursor:grabbing}
.map>svg .rg{fill:#1e2e5c;stroke:rgba(255,255,255,.26);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s}
.map>svg .rg.has{fill:#243a78}
.map>svg .rg.live{fill:#1d5068}
.lay{position:absolute;inset:0;pointer-events:none}
.lay>*{pointer-events:auto}
.rlabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.42);white-space:nowrap;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px}
.pin .dot{width:12px;height:12px;border-radius:50%;background:rgba(190,198,220,.5);box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.pin.open .dot{width:auto;height:auto;border-radius:980px;padding:5px 11px;background:#18b084;box-shadow:0 0 0 2px #fff,0 6px 18px rgba(0,0,0,.35);font-size:12.5px;font-weight:700;white-space:nowrap}
.pin .nm{position:absolute;top:100%;margin-top:4px;font-size:11px;font-weight:600;white-space:nowrap;color:rgba(255,255,255,.86);text-shadow:0 1px 3px rgba(0,0,0,.7);max-width:170px;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.pin.sel .dot{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(120,160,255,.7)}
.pin:hover{z-index:5}
.cl{position:absolute;transform:translate(-50%,-50%);min-width:42px;height:42px;padding:0 10px;border-radius:980px;border:0;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6),0 8px 22px rgba(0,0,0,.35);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.cl small{font-size:11px;font-weight:600;color:#9af0cf}
.gl{background:linear-gradient(150deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,.05) 55%,rgba(255,255,255,.1) 100%),rgba(12,22,54,.5);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 14px 40px rgba(0,0,0,.35);border-radius:18px;color:#fff}
.p-tl{position:absolute;left:16px;top:16px;width:310px;max-height:calc(100% - 32px);display:flex;flex-direction:column;padding:14px;gap:10px}
.p-tl>*{flex:none}.p-tl>.list{flex:1 1 auto}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.6)}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.search input{flex:1;min-width:0;border:0;background:none;color:#fff;font:inherit;font-size:14px;outline:none}
.search input::placeholder{color:rgba(255,255,255,.55)}
.search button{border:0;background:none;color:rgba(255,255,255,.7);padding:4px;font-size:13px}
.count{display:flex;gap:10px;align-items:center}
.count .n{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.count div{font-size:12.5px;color:rgba(255,255,255,.75);line-height:1.35}
.count div b{color:#fff}
.list{overflow:auto;margin:0 -6px;padding:0 6px;display:flex;flex-direction:column;gap:6px;min-height:0}
.list h3{margin:8px 2px 2px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.55);text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:12px;padding:9px 11px;background:rgba(255,255,255,.08);color:#fff;width:100%}
.row:hover{background:rgba(255,255,255,.14)}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row span{display:block;font-size:11.5px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pr{flex:none;font-size:12.5px;font-weight:700;color:#9af0cf}
.row.off b{font-weight:500;color:rgba(255,255,255,.8)}
.none{font-size:12.5px;color:rgba(255,255,255,.7);padding:6px 2px}
.p-zoom{position:absolute;left:342px;bottom:16px;display:flex;gap:2px;padding:4px;border-radius:14px}
.p-zoom button{border:0;background:none;color:#fff;height:34px;min-width:34px;padding:0 10px;border-radius:10px;font-size:15px;font-weight:600}
.p-zoom button:hover{background:rgba(255,255,255,.14)}
.p-leg{position:absolute;right:16px;bottom:16px;display:flex;gap:14px;padding:10px 14px;border-radius:14px;font-size:12px;color:rgba(255,255,255,.85)}
.p-leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.pop{position:absolute;width:300px;padding:14px;z-index:8;transform:translate(-50%,-100%);margin-top:-22px}
.pop h2{margin:0;font-size:15px;font-weight:700;line-height:1.25;padding-right:26px}
.pop .where{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px}
.pop .x{position:absolute;right:8px;top:8px;border:0;background:rgba(255,255,255,.14);color:#fff;width:26px;height:26px;border-radius:50%;font-size:12px}
.pop .chip{display:inline-block;margin-top:10px;padding:3px 9px;border-radius:980px;font-size:11.5px;font-weight:700;background:rgba(24,176,132,.25);color:#9af0cf}
.pop .chip.off{background:rgba(255,255,255,.14);color:rgba(255,255,255,.8)}
.pop .kv{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-size:12.5px;color:rgba(255,255,255,.75)}
.pop .kv b{font-size:15px;color:#fff}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:10px}
.strip i{font-style:normal;text-align:center;font-size:9.5px;font-weight:600;padding:5px 0;border-radius:6px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.strip i.f{background:#18b084;color:#fff}
.pop p{margin:10px 0 0;font-size:12px;color:rgba(255,255,255,.75)}
.pop .go{margin-top:12px;width:100%;border:0;border-radius:12px;padding:10px;background:#fff;color:var(--accent-ink);font-weight:700;font-size:13.5px}
/* καρτέλα */
.card{flex:1;min-height:0;overflow:auto;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 40px;display:grid;gap:14px}
.back{justify-self:start;border:0;background:none;color:var(--accent-ink);font-weight:600;font-size:14px;padding:6px 0}
.box{background:var(--surface);border-radius:18px;padding:20px;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.k{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.card h1{margin:6px 0 2px;font-size:26px;letter-spacing:-.02em;line-height:1.15}
.card .area{color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.fact{padding:12px 14px;border-radius:14px;background:var(--fill)}
.fact span{display:block;font-size:12px;color:var(--muted)}
.fact b{display:block;font-size:17px;margin-top:2px}
.fact small{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.sec-h h2{margin:0;font-size:17px;letter-spacing:-.01em}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--fill)}
.seg button{border:0;background:none;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pos{padding:14px 0;border-top:1px solid var(--line)}
.pos-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.pos-h b{font-size:15px}
.pos-h .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:980px;background:var(--fill);color:var(--ink2)}
.pos-h .price{margin-left:auto;font-size:15px;font-weight:700}
.pos-h .price small{font-size:12px;font-weight:500;color:var(--muted)}
.pos .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:10px}
.months span{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;border-radius:9px;background:var(--fill);color:var(--faint);font-size:11.5px;font-weight:600}
.months span.f{background:var(--ok-soft);color:var(--ok-ink);box-shadow:inset 0 0 0 1px rgba(22,132,84,.35)}
.months span small{font-size:9.5px;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--fill2)}
.legend i.f{background:var(--ok-soft);box-shadow:inset 0 0 0 1px rgba(22,132,84,.45)}
.note{font-size:12.5px;color:var(--muted);margin:12px 0 0}
.aside h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.aside p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.aside .btn{width:100%;border:0;border-radius:12px;padding:11px;background:var(--fill2);color:var(--faint);font-weight:700;cursor:default}
.b3d{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.b3d p{margin:0;flex:1;min-width:220px;font-size:13px;color:var(--muted)}
.btn-p{border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:#fff;font-weight:700}
.f3d{display:block;width:100%;height:min(660px,72vh);border:0;border-radius:16px;margin-top:14px;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.closed{border-left:4px solid var(--fill2)}
.closed b{display:block;font-size:17px;margin-bottom:4px}
.closed p{margin:0;color:var(--muted)}
/* είσοδος / μηνύματα */
.gate{flex:1;display:grid;place-items:center;padding:24px;background:linear-gradient(165deg,#16255a 0%,#0a1230 100%);color:#fff}
.gate .gl{max-width:440px;padding:26px}
.gate h1{margin:0 0 8px;font-size:22px;letter-spacing:-.01em}
.gate p{margin:0;color:rgba(255,255,255,.78)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:820px){
 .hd{padding:0 12px;gap:8px}.who{display:none}
 .p-tl{left:8px;right:8px;top:8px;width:auto;max-height:46%}
 .map.has-sel .p-tl .list,.map.has-sel .p-tl .count,.map.has-sel .p-tl .seg{display:none}
 .p-leg{display:none}.p-zoom{left:8px;bottom:8px}
 .pop{left:8px!important;right:8px;top:auto!important;bottom:60px;width:auto;transform:none;margin:0}
 .cols{grid-template-columns:1fr}.wrap{padding:12px 12px 32px}.card h1{font-size:22px}
 .months{grid-template-columns:repeat(6,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 svg.addEventListener('dblclick',e=>{const r=mapEl.getBoundingClientRect();zoomAt(2,e.clientX-r.left,e.clientY-r.top);});
}
function focusPh(id){const p=S.list.find(x=>x.id===id);if(!p||!p._xy)return;S.sel=id;let d=1e9;S.list.forEach(o=>{if(o!==p&&o._xy)d=Math.min(d,Math.hypot(o._xy.x-p._xy.x,o._xy.y-p._xy.y));});S.z.k=Math.max(14,Math.min(900,70/Math.max(d,0.01)));S.z.cx=p._xy.x;S.z.cy=p._xy.y-(window.innerWidth<820?0:70/S.z.k);sched();}

/* ---------- καρτέλα ---------- */
async function openCard(id){
 S.view='card';S.card=null;S.cardBusy=true;S.show3d=false;S.plan3d=null;render();
 try{S.card=await rpc('scl360_mk_pharmacy',{p_key:KEY,p_registry_id:id});}
 catch(e){S.card={error:true};}
 S.cardBusy=false;if(S.view==='card')render();
}
function deadline(y,m){const pm=m===0?11:m-1,py=m===0?y-1:y;return '8 '+MONG[pm]+(py!==y?' '+py:'');}
function renderCard(){
 const c=S.card;let h=header()+'<div class="card"><div class="wrap"><button type="button" class="back" data-a="home">‹ Πίσω στον χάρτη</button>';
 if(S.cardBusy||!c){h+='<div class="box"><p class="note" style="margin:0">Φόρτωση φαρμακείου…</p></div>';}
 else if(c.error){h+='<div class="box closed"><b>Δεν φορτώθηκε το φαρμακείο</b><p>Δοκιμάστε ξανά σε λίγο.</p></div>';}
 else if(!c.open){
  h+='<div class="box"><div class="k">Προφίλ φαρμακείου</div><h1>'+E(c.name)+'</h1><div class="area">'+E(c.area||'')+'</div></div>'+
   '<div class="box closed"><b>Αυτό το φαρμακείο δεν είναι ανοιχτό στο Market</b><p>Το φαρμακείο δεν έχει ανοίξει ακόμα το «Φαίνεται στις εταιρίες στο SpaceCoLLab Market». Το βλέπετε στον χάρτη, αλλά δεν μπορείτε να ζητήσετε θέση εδώ.</p></div>';
 }else{
  const ps=c.positions||[],ys=years([c]);if(ys.indexOf(S.year)<0)S.year=ys[0]||S.year;
  const pr=minPrice(c,S.year);
  h+='<div class="box"><div class="k">Προφίλ φαρμακείου</div><h1>'+E(c.name)+'</h1><div class="area">'+E(c.area||'')+'</div><div class="facts">'+
   '<div class="fact"><span>Πελάτες τον μήνα</span><b>'+E(c.band?BANDS[c.band]:'Χωρίς στοιχεία')+'</b><small>'+(c.band?'Εκτίμηση από αποδείξεις, όχι μέτρηση οθόνης.':'Δεν υπάρχουν ακόμα στοιχεία κίνησης.')+'</small></div>'+
   '<div class="fact"><span>Τι μπορείτε να κλείσετε εδώ</span><b>'+ps.length+' '+(ps.length===1?'θέση':'θέσεις')+' πάγκου</b><small>Κάθε θέση είναι οθόνη με όλα τα ράφια της.</small></div>'+
   (pr!=null?'<div class="fact"><span>Τιμή θέσης '+S.year+'</span><b>από '+euro(pr)+' / μήνα</b><small>Τιμή του φαρμακείου · προ ΦΠΑ.</small></div>':'')+'</div></div>';
  if(c.plan){
   h+='<div class="box"><div class="sec-h"><h2>Το φαρμακείο σε 3D</h2></div>'+(S.show3d?'<iframe class="f3d" title="3D φαρμακείου" src="spacecollab_market_3d.html"></iframe><p class="note">Σύρετε για περιστροφή, ρόδα για ζουμ.</p>':'<div class="b3d"><p>Δείτε πού βρίσκονται οι οθόνες μέσα στο φαρμακείο. Ανοίγει στη γωνία που έχει ορίσει η Pharmaplus.</p><button type="button" class="btn-p" data-a="3d">Δείτε το φαρμακείο σε 3D</button></div>')+'</div>';
  }
  h+='<div class="cols"><div class="box"><div class="sec-h"><h2>Θέσεις και ελεύθεροι μήνες</h2>'+(ys.length>1?'<div class="seg" role="group" aria-label="Έτος">'+ys.map(y=>'<button type="button" data-a="year" data-y="'+y+'" aria-pressed="'+(y===S.year)+'">'+y+'</button>').join('')+'</div>':'<span class="pos-h"><span class="tag">'+E(S.year)+'</span></span>')+'</div>';
  ps.forEach(p=>{const y=(p.years||[]).find(x=>x.year===S.year),f=new Set(y&&y.free||[]);
   h+='<div class="pos"><div class="pos-h"><b>'+E(p.title)+'</b><span class="tag">Πάγκος</span><span class="tag">'+(p.format==='horizontal'?'Οριζόντια · 1920×1080':'Κάθετη · 1080×1920')+'</span>'+(y?'<span class="price">'+euro(y.price)+' <small>/ μήνα</small></span>':'')+'</div><div class="meta">Οθόνη με όλα τα ράφια της · '+(f.size?f.size+' '+(f.size===1?'ελεύθερος μήνας':'ελεύθεροι μήνες'):'κανένας ελεύθερος μήνας')+' το '+E(S.year)+'</div>'+
    '<div class="months" role="list" aria-label="Μήνες '+E(S.year)+'">'+MON.map((m,i)=>'<span role="listitem" class="'+(f.has(i)?'f':'')+'" title="'+(f.has(i)?'Διαθέσιμο · αίτημα έως '+deadline(S.year,i):'Μη διαθέσιμο')+'">'+m+'<small>'+(f.has(i)?'ελεύθ.':'—')+'</small></span>').join('')+'</div></div>';});
  h+='<div class="legend"><span><i class="f"></i>Διαθέσιμο</span><span><i></i>Μη διαθέσιμο</span></div>'+
   '<p class="note">Ένας μήνας δεν φαίνεται ελεύθερος αν το φαρμακείο έχει ήδη συμφωνία, προσυμφωνία ή χορηγία ραφιών, ή αν πέρασε η προθεσμία: κάθε μήνας ζητιέται έως τις 8 του προηγούμενου. Η τιμή είναι του φαρμακείου και δεν αλλάζει από εδώ.</p></div>'+
   '<aside class="box aside"><h3>Το αίτημά σας <span class="soon">Σύντομα</span></h3><p>Σε αυτή την πρώτη έκδοση βλέπετε φαρμακεία, θέσεις, τιμές και ελεύθερους μήνες. Τα αιτήματα ανοίγουν στο επόμενο βήμα.</p><p>Όταν ανοίξουν: το φαρμακείο απαντά μέσα σε 7 ημέρες. Αν δεν δεχτεί ή δεν απαντήσει, δεν πληρώνετε.</p><button type="button" class="btn" disabled>Αίτημα θέσης</button><p style="margin:10px 0 0">Όλες οι τιμές προ ΦΠΑ.</p></aside></div>';
 }
 $app.innerHTML=h+'</div></div>';mapEl=null;
}
function render(){if(S.view==='card')renderCard();else renderMap();}

document.addEventListener('click',e=>{
 const t=e.target.closest&&e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 if(a==='home'){if(S.view!=='map'){S.view='map';render();}return;}
 if(a==='pin'){S.sel=S.sel===t.dataset.id?null:t.dataset.id;sched();return;}
 if(a==='unsel'){S.sel=null;sched();return;}
 if(a==='focus'){focusPh(t.dataset.id);return;}
 if(a==='cluster'){const ids=t.dataset.g.split(','),pts=S.list.filter(p=>ids.indexOf(p.id)>=0).map(p=>p._xy);const k0=S.z.k;fit(bounds(pts),window.innerWidth<820?60:140,900);if(S.z.k<k0*1.8)S.z.k=Math.min(900,k0*2.2);sched();return;}
 if(a==='open'){openCard(t.dataset.id);return;}
 if(a==='zin'){zoomAt(1.7,mapEl.clientWidth/2,mapEl.clientHeight/2);return;}
 if(a==='zout'){zoomAt(1/1.7,mapEl.clientWidth/2,mapEl.clientHeight/2);return;}
 if(a==='gr'){S.sel=null;greece();sched();return;}
 if(a==='year'){S.year=Number(t.dataset.y);render();return;}
 if(a==='3d'){S.plan3d={name:S.card.name,plan:S.card.plan,positions:S.card.positions||[]};S.show3d=true;render();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.view==='map'&&S.sel){S.sel=null;sched();}});
window.addEventListener('resize',()=>{if(mapEl)sched();});

async function start(){
 if(!UUID.test(KEY)){gate('Χρειάζεστε προσωπικό σύνδεσμο','Το SpaceCoLLab Market ανοίγει μόνο με τον σύνδεσμο που σας έδωσε η Pharmaplus.');return;}
 if(!window.supabase||!window.supabase.createClient){gate('Δεν φορτώθηκε η σελίδα','Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά.');return;}
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
 gate('SpaceCoLLab Market','Φόρτωση φαρμακείων…',true);
 try{
  const list=await rpc('scl360_mk_list',{p_key:KEY});
  S.list=(Array.isArray(list)?list:[]).filter(Boolean).map(p=>{if(p.lat!=null&&p.lng!=null){p._xy=proj(Number(p.lat),Number(p.lng));p._rg=regionOf(p._xy);}return p;});
  const ys=years(S.list),ny=new Date().getFullYear()+1;S.year=ys.indexOf(ny)>=0?ny:(ys[0]||ny);
  render();
 }catch(e){
  const m=String(e&&e.message||'');
  if(/πρόσβαση Market|42501/i.test(m))gate('Ο σύνδεσμος δεν ισχύει','Ζητήστε νέο σύνδεσμο από την Pharmaplus.');
  else gate('Δεν φορτώθηκαν τα φαρμακεία','Δοκιμάστε ξανά σε λίγο.');
 }
}
start();
})();
</script>
