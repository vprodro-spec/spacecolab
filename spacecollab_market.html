e=\"button\" onClick=\"{{hfInfo.close}}\" aria-label=\"Κλείσιμο\" style=\"width: 26px; height: 26px; border: 0; border-radius: 13px; background: #f0f0f3; color: #48484a; font-size: 14px; cursor: pointer\">×</button></div><div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px\"><sc-for list=\"{{hfInfo.rows}}\" as=\"r\" hint-placeholder-count=\"4\"><div style=\"display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; line-height: 1.35\"><span style=\"color: #636366\">{{r.l}}</span><b style=\"text-align: right\">{{r.v}}</b></div></sc-for></div><div style=\"display: flex; align-items: center; gap: 10px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,0.08)\"><span style=\"font-size: 12px; color: #636366\">{{hfInfo.mLbl}}</span><span aria-hidden=\"true\" style=\"display: inline-flex; gap: 3px\"><sc-for list=\"{{hfInfo.bars}}\" as=\"b\" hint-placeholder-count=\"5\"><span style=\"{{b.s}}\"></span></sc-for></span><b style=\"font-size: 12px\">{{hfInfo.mTxt}}</b><button type=\"button\" onClick=\"{{hfInfo.more}}\" style=\"margin-left: auto; border: 0; background: transparent; color: #2459e0; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 4px 0; font-family: inherit\">Όλα τα στοιχεία ›</button></div></div></sc-if><sc-if value=\"{{hfHint}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; background: #0f1b3d; color: #ffffff; box-shadow: 0 6px 18px rgba(15,27,61,0.28); pointer-events: none\">Πατήστε μια θέση της βιτρίνας</span></sc-if></div><span style=\"position: absolute; left: 12px; top: 12px; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; background: rgba(15,27,61,0.82); color: #ffffff; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; pointer-events: none\"><span aria-hidden=\"true\" style=\"width: 7px; height: 7px; border-radius: 50%; background: #ffb469\"></span>ΟΨΗ</span></div>\n              <div style=\"display: flex; flex-direction: column; gap: 14px; padding: 22px 16px 14px\">\n                <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #ffb469\">ΒΙΤΡΙΝΑ</span>\n                <h3 style=\"margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 800\">Σας βλέπει<br><span style=\"color: #ff9a3c\">όλος ο δρόμος.</span></h3>\n                <span style=\"font-size: 14.5px; line-height: 1.5; color: rgba(255,255,255,0.76)\">Θέσεις στο τζάμι του φαρμακείου, με τα μέτρα τους. Σας βλέπει και όποιος απλώς περνά απέξω, όλη μέρα. Το υλικό το φτιάχνετε εσείς.</span>\n                <div style=\"display: grid; grid-template-columns: 1.15fr 1fr 1fr; padding: 16px 0 2px; border-top: 1px solid rgba(255,255,255,0.14)\"><div style=\"display: flex; flex-direction: column; gap: 3px; padding: 0 14px; padding-left: 0;\"><b style=\"font-size: 23px; letter-spacing: -0.025em; line-height: 1.1; white-space: nowrap\">{{hsPass}}</b><span style=\"font-size: 12px; line-height: 1.35; color: rgba(255,255,255,0.66)\">περαστικοί την ημέρα<br>σε αυτό το φαρμακείο</span></div><div style=\"display: flex; flex-direction: column; gap: 3px; padding: 0 14px; border-left: 1px solid rgba(255,255,255,0.16);\"><b style=\"font-size: 23px; letter-spacing: -0.025em; line-height: 1.1; white-space: nowrap\">{{hsNVit}}</b><span style=\"font-size: 12px; line-height: 1.35; color: rgba(255,255,255,0.66)\">φαρμακεία<br>με βιτρίνα</span></div><div style=\"display: flex; flex-direction: column; gap: 3px; padding: 0 14px; border-left: 1px solid rgba(255,255,255,0.16);\"><b style=\"font-size: 23px; letter-spacing: -0.025em; line-height: 1.1; white-space: nowrap\">από 50 €</b><span style=\"font-size: 12px; line-height: 1.35; color: rgba(255,255,255,0.66)\">τον μήνα,<br>μέσω Pharmaplus</span></div></div>\n                <div style=\"display: flex; flex-direction: column; gap: 9px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10)\"><span style=\"font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.66)\">Για κάθε φαρμακείο βλέπετε πριν κλείσετε</span><div style=\"display: flex; flex-wrap: wrap; gap: 6px\"><span style=\"padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,0.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); color: rgba(255,255,255,0.88); font-size: 12px; font-weight: 600\">Κίνηση στον δρόμο</span><span style=\"padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,0.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); color: rgba(255,255,255,0.88); font-size: 12px; font-weight: 600\">Όψεις με μέτρα</span><span style=\"padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,0.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); color: rgba(255,255,255,0.88); font-size: 12px; font-weight: 600\">Τι χωράει</span><span style=\"padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,0.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); color: rgba(255,255,255,0.88); font-size: 12px; font-weight: 600\">Ελεύθεροι μήνες</span><span style=\"padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,0.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); color: rgba(255,255,255,0.88); font-size: 12px; font-weight: 600\">Η γειτονιά</span><button type=\"button\" onClick=\"{{hsMoreVit}}\" style=\"padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,0.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); color: rgba(255,255,255,0.88); font-size: 12px; font-weight: 600; border: 0; cursor: pointer; font-family: inherit; background: rgba(255,154,60,0.18); color: #ffc48a\">Δείτε ένα παράδειγμα ›</button></div></div>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 2px\"><button type=\"button\" onClick=\"{{goMapVit}}\" style=\"min-height: 48px; padding: 0 18px; border: 0; border-radius: 14px; background: #ffffff; color: #0f1b3d; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit\">Ένα-ένα στον χάρτη</button><button type=\"button\" onClick=\"{{goCentralVit}}\" style=\"min-height: 48px; padding: 0 18px; border: 0; border-radius: 14px; background: rgba(255,255,255,0.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22); color: #ffffff; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit\">Πολλά μαζί · έως 50 % φθηνότερα</button></div>\n              </div>\n            </div>\n          </div>\n          <span style=\"font-size: 13.5px; line-height: 1.5; color: #636366\"><b style=\"color: #1d1d1f\">Ένα-ένα στον χάρτη:</b> διαλέγετε εσείς φαρμακείο, θέση και μήνες, στην τιμή του φαρμακείου. <b style=\"color: #1d1d1f\">Πολλά μαζί:</b> ένα αίτημα προς πολλά φαρμακεία μέσω Pharmaplus· πληρώνετε μόνο όσα δεχτούν.</span>\n        </section>\n\n        <section style=\"flex: none; display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px\">\n            <span style=\"font-size: 24px; font-weight: 700; letter-spacing: -0.025em\">Πώς λειτουργεί</span>\n            <button type=\"button\" onClick=\"{{openGuide}}\" style=\"border: 0; background: transparent; color: #2459e0; font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 2px\">Άνοιγμα Οδηγού</button>\n          </div>\n          <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px\">\n            <div class=\"rise lift\" style=\"animation-delay: 0.1s; display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.035), 0 1px 2px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.025)\">\n              <span aria-hidden=\"true\" style=\"width: 30px; height: 30px; border-radius: 15px; background: #0f1b3d; color: #ffffff; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">1</span>\n              <b style=\"font-size: 17px; letter-spacing: -0.01em\">Διαλέγετε</b>\n              <span style=\"font-size: 14px; line-height: 1.5; color: #636366\">Ένα συγκεκριμένο φαρμακείο από τον χάρτη, ή πολλά φαρμακεία μαζί μέσω Pharmaplus.</span>\n            </div>\n            <div class=\"rise lift\" style=\"animation-delay: 0.18s; display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.035), 0 1px 2px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.025)\">\n              <span aria-hidden=\"true\" style=\"width: 30px; height: 30px; border-radius: 15px; background: #0f1b3d; color: #ffffff; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">2</span>\n              <b style=\"font-size: 17px; letter-spacing: -0.01em\">Το φαρμακείο απαντά</b>\n              <span style=\"font-size: 14px; line-height: 1.5; color: #636366\">Κάθε φαρμακείο έχει 7 ημέρες να δεχτεί ή να αρνηθεί το αίτημά σας.</span>\n            </div>\n            <div class=\"rise lift\" style=\"animation-delay: 0.26s; display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.035), 0 1px 2px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.025)\">\n              <span aria-hidden=\"true\" style=\"width: 30px; height: 30px; border-radius: 15px; background: #0f1b3d; color: #ffffff; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center\">3</span>\n              <b style=\"font-size: 17px; letter-spacing: -0.01em\">Πληρώνετε μόνο αν δεχτεί</b>\n              <span style=\"font-size: 14px; line-height: 1.5; color: #636366\">Για όσα φαρμακεία αρνηθούν δεν υπάρχει χρέωση.</span>\n            </div>\n          </div>\n        </section>\n\n\n\n      </div>\n    </sc-if>\n\n    <!-- ===================== ΤΑ ΑΙΤΗΜΑΤΑ ΜΟΥ ===================== -->\n    <sc-if value=\"{{vOwe}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"scr\" style=\"flex: 1; overflow-y: auto; padding: 24px 36px 32px; display: flex; flex-direction: column; gap: 18px\">\n        <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px\">\n          <div style=\"padding: 18px 20px; border-radius: 18px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 12px; font-weight: 600; color: #636366\">Στα φαρμακεία · {{oweN}}</span><b style=\"font-size: 28px; letter-spacing: -0.02em\">{{oweTot}}</b><span style=\"font-size: 12px; color: #636366\">Πληρώνετε κάθε φαρμακείο απευθείας, στο τέλος κάθε μήνα προβολής</span></div>\n          <div style=\"padding: 18px 20px; border-radius: 18px; background: #eef8f7; box-shadow: inset 0 0 0 1.5px #00888a; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 12px; font-weight: 600; color: #006b6d\">Στην Pharmaplus</span><b style=\"font-size: 28px; letter-spacing: -0.02em; color: #006b6d\">{{owePPTot}}</b><span style=\"font-size: 12px; color: #006b6d\">Καμπάνιες PharmaPlus και παραγωγή βιτρίνας</span></div>\n          <div style=\"padding: 18px 20px; border-radius: 18px; color: #ffffff; background: linear-gradient(155deg, #1a2a52 0%, #0b1431 100%); display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7)\">Σύνολο</span><b style=\"font-size: 28px; letter-spacing: -0.02em\">{{oweAll}}</b><span style=\"font-size: 12px; color: rgba(255,255,255,0.7)\">{{vat}} Χωρίς τις προσφορές που αναμένονται.</span></div>\n        </div>\n        <section style=\"padding: 22px 24px 12px; border-radius: 22px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.035), 0 1px 2px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap\"><b style=\"font-size: 18px; letter-spacing: -0.01em\">Ανά φαρμακείο</b><span style=\"font-size: 13px; color: #636366\">Από αιτήματα και από «Πολλά φαρμακεία μαζί», μόνο όσα έγιναν δεκτά</span></div>\n          <div style=\"display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.6fr) 130px; gap: 16px; font-size: 11.5px; font-weight: 700; color: #636366\"><span>Επωνυμία</span><span>Τι αφορά</span><span style=\"text-align: right\">Ποσό</span></div>\n          <div style=\"display: flex; flex-direction: column\"><sc-for list=\"{{oweRows}}\" as=\"r\" hint-placeholder-count=\"6\"><div style=\"display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.6fr) 130px; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid rgba(0,0,0,0.07)\"><span style=\"display: flex; flex-direction: column; gap: 1px; min-width: 0\"><b style=\"font-size: 14px\">{{r.name}}</b><span style=\"font-size: 12px; color: #636366\">{{r.where}}</span></span><span style=\"font-size: 12.5px; color: #48484a; line-height: 1.45\">{{r.line}}</span><b style=\"font-size: 15px; text-align: right; font-variant-numeric: tabular-nums\">{{r.sum}}</b></div></sc-for></div>\n        </section>\n        <section style=\"padding: 22px 24px 12px; border-radius: 22px; background: #eef8f7; box-shadow: inset 0 0 0 1.5px #00888a; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap\"><b style=\"font-size: 18px; letter-spacing: -0.01em; color: #006b6d\">Στην Pharmaplus</b><span style=\"font-size: 13px; color: #006b6d\">Καμπάνιες PharmaPlus και παραγωγή βιτρίνας</span></div>\n          <div style=\"display: flex; flex-direction: column\"><sc-for list=\"{{owePP}}\" as=\"r\" hint-placeholder-count=\"4\"><div style=\"display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.5fr) 170px; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid rgba(0,107,109,0.18)\"><b style=\"font-size: 14px\">{{r.name}}</b><span style=\"font-size: 12.5px; color: #48484a; line-height: 1.45\">{{r.line}}</span><b style=\"font-size: 15px; text-align: right; font-variant-numeric: tabular-nums\">{{r.sum}}</b></div></sc-for></div>\n        </section>\n        <span style=\"font-size: 12.5px; color: #636366; line-height: 1.5\">Η σελίδα είναι μόνο ενημερωτική και δεν εκδίδει παραστατικά. Τα τιμολόγια τα εκδίδει κάθε φαρμακείο και η Pharmaplus. {{vat}}</span>\n      </div>\n    </sc-if>\n\n    <sc-if value=\"{{vBook}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"scr\" style=\"flex: 1; overflow-y: auto; padding: 24px 36px 32px; display: flex; flex-direction: column; gap: 18px\">\n        <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; position: relative\">\n          <b style=\"font-size: 17px; letter-spacing: -0.01em\">Όλα τα αιτήματα</b>\n          <sc-if value=\"{{laterOn}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" onClick=\"{{toggleExport}}\" aria-expanded=\"{{exportOpen}}\" style=\"min-height: 42px; padding: 0 16px; border: 0; border-radius: 12px; background: #ffffff; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.14); color: #1d1d1f; font-size: 13px; font-weight: 700; cursor: pointer; flex: none\">Εξαγωγή και κοινοποίηση ▾</button>\n          <sc-if value=\"{{exportOpen}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position: absolute; right: 0; top: 52px; z-index: 5; width: 300px; padding: 6px; border-radius: 14px; background: #ffffff; box-shadow: 0 12px 36px rgba(0,0,0,0.24), 0 0 0 1px rgba(0,0,0,0.08); display: flex; flex-direction: column\">\n              <sc-for list=\"{{exportOpts}}\" as=\"e\" hint-placeholder-count=\"3\"><button type=\"button\" onClick=\"{{e.pick}}\" style=\"display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; font-family: inherit; color: #1d1d1f\"><b style=\"font-size: 13px\">{{e.label}}</b><span style=\"font-size: 12px; color: #636366; line-height: 1.4\">{{e.sub}}</span></button></sc-for>\n            </div>\n          </sc-if></sc-if>\n        </div>\n\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px\"><b style=\"font-size: 15px\">Το όνομα του αρχείου σας</b><span style=\"font-size: 12px; color: #636366\">Ένα αρχείο για κάθε σχήμα οθόνης (κάθετο, οριζόντιο). Το όνομα το δίνει το σύστημα· το αντιγράφετε και στέλνετε το αρχείο με αυτό το όνομα. Παράδοση έως τις 15 του προηγούμενου μήνα (π.χ. για Μάρτιο, έως 15 Φεβρουαρίου). Αν το υλικό δεν έρθει έως τις 15, παίζει το πρόγραμμα του φαρμακείου και η χρέωση ισχύει. Αν αλλάζει θέμα κάθε μήνα, ισχύει για κάθε μήνα χωριστά.</span>\n            <sc-if value=\"{{hasMissing}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding: 2px 9px; border-radius: 999px; background: #fff4d6; color: #7a4b00; font-size: 11px; font-weight: 800\">Ονόματα προς αντιγραφή: {{missingN}}</span></sc-if>\n          </div>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 14px\">\n            <sc-for list=\"{{upCards}}\" as=\"u\" hint-placeholder-count=\"2\">\n              <div style=\"{{u.style}}\">\n                <span aria-hidden=\"true\" style=\"display: flex; align-items: center; justify-content: center; width: 60px; flex: none\"><span style=\"{{u.shape}}\"></span></span>\n                <div style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1\"><span style=\"display: flex; align-items: center; gap: 8px\"><b style=\"font-size: 14px\">{{u.title}}</b><span style=\"{{u.chipStyle}}\">{{u.chip}}</span></span><sc-if value=\"{{u.hasName}}\" hint-placeholder-val=\"{{ true }}\"><code style=\"font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #0f1b3d; background: #eef2fb; padding: 3px 8px; border-radius: 7px; align-self: flex-start; word-break: break-all\">{{u.fname}}</code></sc-if><span style=\"font-size: 12px; color: #636366; line-height: 1.4\">{{u.need}}</span></div>\n                <button type=\"button\" onClick=\"{{u.pick}}\" style=\"{{u.btnStyle}}\">{{u.btn}}</button>\n              </div>\n            </sc-for>\n          </div>\n        </div>\n\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; align-items: start\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px\" role=\"list\" aria-label=\"Αιτήματα\">\n            \n            <sc-for list=\"{{bkRows}}\" as=\"b\" hint-placeholder-count=\"6\">\n              <button type=\"button\" role=\"listitem\" onClick=\"{{b.pick}}\" aria-pressed=\"{{b.on}}\" aria-label=\"{{b.aria}}\" style=\"{{b.style}}\">\n                <span style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0; text-align: left\"><b style=\"font-size: 14px; letter-spacing: -0.005em\">{{b.title}}</b><span style=\"font-size: 12px; color: #636366\"><b style=\"font-weight: 700; color: #1a45b0\">{{b.brandTxt}}</b>{{b.period}}</span></span>\n                <span style=\"{{b.chipStyle}}\">{{b.chip}}</span>\n              </button>\n            </sc-for>\n          </div>\n          <div style=\"padding: 22px 24px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 12px 32px rgba(10,20,50,0.10); display: flex; flex-direction: column; gap: 14px; min-width: 0\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <span style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\"><span style=\"{{dChipStyle}}\">{{dChip}}</span><span style=\"font-size: 12px; color: #8e8e93; font-variant-numeric: tabular-nums\">{{dRef}}</span></span>\n              <span style=\"font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2\">{{dTitle}}</span>\n              <span style=\"font-size: 14px; line-height: 1.5; color: #48484a\">{{dText}}</span>\n            </div>\n            <sc-if value=\"{{hasClock}}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: #f5f5f7\">\n                <span style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\"><span style=\"{{clockStyle}}\">{{clock}}</span><span style=\"font-size: 12px; color: #636366\">{{until}}</span></span>\n                <span style=\"display: flex; gap: 3px\" aria-hidden=\"true\"><sc-for list=\"{{ticks}}\" as=\"t\" hint-placeholder-count=\"15\"><span style=\"{{t.style}}\"></span></sc-for></span>\n              </div>\n            </sc-if>\n            <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n              <sc-for list=\"{{dFacts}}\" as=\"f\" hint-placeholder-count=\"3\"><div style=\"padding: 11px 12px; border-radius: 12px; background: #f5f5f7; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 11px; color: #636366\">{{f.k}}</span><b style=\"font-size: 14px; line-height: 1.3\">{{f.v}}</b></div></sc-for>\n            </div>\n            <sc-if value=\"{{dHasWhat}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 9px; padding: 14px 16px; border-radius: 14px; background: #f5f5f7\">\n                <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #636366\">ΤΙ ΠΡΟΩΘΕΙΤΕ</span>\n                <span style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap\"><b style=\"font-size: 17px; letter-spacing: -0.01em\">{{dBrand}}</b><span style=\"font-size: 12px; color: #636366\">{{dCat}}</span></span>\n                <span style=\"display: flex; flex-wrap: wrap; gap: 6px\"><sc-for list=\"{{dProds}}\" as=\"p\" hint-placeholder-count=\"2\"><span style=\"{{p.style}}\">{{p.t}}</span></sc-for></span>\n                <sc-if value=\"{{dHasMsg}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; line-height: 1.5; color: #48484a\">«{{dMsg}}»</span></sc-if>\n              </div>\n            </sc-if>\n            <sc-if value=\"{{dPtsOn}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 14px; background: #f5f5f7\">\n                <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #636366\">ΣΗΜΕΙΑ ΤΟΥ ΑΙΤΗΜΑΤΟΣ</span>\n                <sc-for list=\"{{dPts}}\" as=\"q\" hint-placeholder-count=\"2\"><span style=\"display: flex; justify-content: space-between; gap: 14px; font-size: 13px; line-height: 1.4\"><span>{{q.t}}</span><b style=\"{{q.style}}\">{{q.s}}</b></span></sc-for>\n                <span style=\"font-size: 12px; color: #636366; line-height: 1.45\">{{dPtsNote}}</span>\n              </div>\n            </sc-if>\n            <sc-if value=\"{{dMat}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; line-height: 1.5; color: #48484a; padding: 11px 13px; border-radius: 12px; background: #f5f5f7\">{{dMatLine}}</span></sc-if>\n\n            <sc-if value=\"{{dVitOn}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 18px; color: #ffffff; background: radial-gradient(120% 150% at 100% 0%, rgba(84,132,255,0.40) 0%, rgba(84,132,255,0) 52%), linear-gradient(155deg, #1a2a52 0%, #0b1431 100%)\">\n                <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: rgba(255,255,255,0.62)\">ΕΚΤΕΛΕΣΗ · ΥΛΙΚΟ ΚΑΙ ΤΟΠΟΘΕΤΗΣΗ</span>\n                <sc-for list=\"{{dVitSteps}}\" as=\"s\" hint-placeholder-count=\"3\"><div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"{{s.dot}}\">{{s.mark}}</span><span style=\"display: flex; flex-direction: column; gap: 1px\"><b style=\"font-size: 14px\">{{s.t}}</b><span style=\"{{s.sStyle}}\">{{s.s}}</span></span></div></sc-for>\n                <sc-if value=\"{{dVitAct}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" onClick=\"{{dVitActPick}}\" style=\"min-height: 42px; border: 0; border-radius: 12px; background: #ffffff; color: #0b1431; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit\">Σημειώστε ότι το υλικό στάλθηκε</button></sc-if>\n              </div>\n              <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 14px; background: #f5f5f7\">\n                <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #636366\">ΔΕΛΤΙΟ ΓΙΑ ΤΟΝ ΤΥΠΟΓΡΑΦΟ</span>\n                <sc-for list=\"{{dVitSpec}}\" as=\"f\" hint-placeholder-count=\"6\"><span style=\"display: flex; justify-content: space-between; gap: 14px; font-size: 13px; line-height: 1.4\"><span style=\"color: #636366; flex: none\">{{f.k}}</span><b style=\"text-align: right\">{{f.v}}</b></span></sc-for>\n                <sc-if value=\"{{dVitWarn}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding: 8px 10px; border-radius: 10px; background: #fff4d6; color: #7a4b00; font-size: 12px; line-height: 1.4; box-shadow: inset 0 0 0 1.5px #c58a00\">Η θέση είναι μικρότερη από το κιτ. Το υλικό μικραίνει αναλογικά, μέσα στο όριο του 15 %.</span></sc-if>\n              </div>\n              \n            </sc-if>\n            <sc-if value=\"{{showFinal}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <b style=\"font-size: 14px\">Τα φαρμακεία που δέχτηκαν</b>\n                <div class=\"scr\" style=\"display: flex; flex-direction: column; max-height: 232px; overflow-y: auto; border-radius: 12px; background: #f5f5f7; padding: 4px 14px\">\n                  <sc-for list=\"{{finalRows}}\" as=\"r\" hint-placeholder-count=\"6\">\n                    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(0,0,0,0.06)\">\n                      <span style=\"display: flex; flex-direction: column; gap: 1px; min-width: 0\"><b style=\"font-size: 13px\">{{r.name}}</b><span style=\"font-size: 12px; color: #636366\">{{r.addr}} · {{r.months}}</span></span>\n                      <b style=\"font-size: 13px\">{{r.amount}}</b>\n                    </div>\n                  </sc-for>\n                </div>\n              </div>\n            </sc-if>\n            <sc-if value=\"{{dCan}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" onClick=\"{{dAct}}\" style=\"min-height: 46px; border: 0; border-radius: 12px; background: #f0f0f3; color: #1d1d1f; font-size: 14px; font-weight: 700; cursor: pointer\">{{dActLabel}}</button></sc-if>\n          </div>\n        </div>\n      </div>\n    </sc-if>\n\n    <!-- ===================== ΣΤΟΙΧΕΙΑ ΑΙΤΗΜΑΤΟΣ ===================== -->\n    <sc-if value=\"{{vForm}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"scr\" style=\"flex: 1; overflow-y: auto; padding: 22px 36px 32px; display: flex; flex-direction: column; gap: 20px\">\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <button type=\"button\" onClick=\"{{fBack}}\" style=\"align-self: flex-start; min-height: 30px; padding: 0; border: 0; background: transparent; color: #636366; font-size: 13px; font-weight: 600; cursor: pointer\">{{fBackLabel}}</button>\n          <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 24px\">\n            <span></span>\n            <span style=\"display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #636366; white-space: nowrap; flex: none; padding-bottom: 6px\"><span style=\"color: #168454\">✓ Φαρμακεία και μήνες</span><span aria-hidden=\"true\">›</span><b style=\"color: #1d1d1f\">Στοιχεία αιτήματος</b><span aria-hidden=\"true\">›</span><span>Αποστολή</span></span>\n          </div>\n        </div>\n\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 22px; align-items: start\">\n          <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0\">\n\n            <section style=\"padding: 20px 22px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\"><b style=\"font-size: 16px; letter-spacing: -0.01em\">Μάρκα από το μητρώο</b><span style=\"{{fReqChipB}}\">{{fReqTxtB}}</span></div>\n              <div role=\"radiogroup\" aria-label=\"Μάρκα\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\">\n                <sc-for list=\"{{fBrands}}\" as=\"b\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" role=\"radio\" aria-checked=\"{{b.on}}\" onClick=\"{{b.pick}}\" style=\"{{b.style}}\">\n                    <span style=\"{{b.monoStyle}}\">{{b.mono}}</span>\n                    <span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\"><b style=\"font-size: 14px; line-height: 1.2\">{{b.n}}</b><span style=\"font-size: 11.5px; color: #636366; line-height: 1.3\">{{b.cat}}</span></span>\n                    <span aria-hidden=\"true\" style=\"{{b.tickStyle}}\">✓</span>\n                  </button>\n                </sc-for>\n              </div>\n              <sc-if value=\"{{fErrB}}\" hint-placeholder-val=\"{{ false }}\"><span role=\"alert\" style=\"font-size: 12.5px; font-weight: 700; color: #a3190f\">Διαλέξτε τη μάρκα που προωθείτε.</span></sc-if>\n              <span style=\"font-size: 12px; line-height: 1.5; color: #636366\">Διαλέγετε από το μητρώο μαρκών. Μόνο αν η μάρκα σας δεν υπάρχει: </span><button type=\"button\" onClick=\"{{goReg}}\" style=\"align-self: flex-start; min-height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: #f0f0f3; color: #1d1d1f; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit\">Νέα μάρκα · έγκριση ονόματος από τα Κεντρικά ›</button>\n            </section>\n\n            <section style=\"padding: 20px 22px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\"><b style=\"font-size: 16px; letter-spacing: -0.01em\">Υποσειρά ή προϊόντα</b><span style=\"{{fReqChipP}}\">{{fReqTxtP}}</span></div>\n              <sc-if value=\"{{fNoBrand}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; line-height: 1.5; color: #8e8e93; padding: 13px 14px; border-radius: 12px; background: #f5f5f7\">Διαλέξτε πρώτα τη μάρκα, για να δείτε τις υποσειρές της.</span></sc-if>\n              <sc-if value=\"{{fHasBrand}}\" hint-placeholder-val=\"{{ true }}\">\n                <div role=\"group\" aria-label=\"Υποσειρά ή προϊόντα\" style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n                  <sc-for list=\"{{fSubs}}\" as=\"s\" hint-placeholder-count=\"5\"><button type=\"button\" aria-pressed=\"{{s.on}}\" onClick=\"{{s.pick}}\" style=\"{{s.style}}\">{{s.t}}</button></sc-for>\n                </div>\n                <label style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 12px; font-weight: 700; color: #48484a\">Άλλο προϊόν ή υποσειρά που δεν υπάρχει πάνω</span><input type=\"text\" value=\"{{fOtherVal}}\" onInput=\"{{fSetO}}\" placeholder=\"π.χ. Omega-3 Sport\" style=\"{{fInStyle}}\"></label>\n                <span style=\"font-size: 12.5px; color: #48484a\">Κατηγορία: <b>{{fCat}}</b> <span style=\"color: #8e8e93\">· από το μητρώο των Κεντρικών</span></span>\n              </sc-if>\n              <sc-if value=\"{{fErrP}}\" hint-placeholder-val=\"{{ false }}\"><span role=\"alert\" style=\"font-size: 12.5px; font-weight: 700; color: #a3190f\">Διαλέξτε τουλάχιστον μία υποσειρά ή γράψτε ένα προϊόν.</span></sc-if>\n            </section>\n\n            <section style=\"padding: 20px 22px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 12px\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\"><b style=\"font-size: 16px; letter-spacing: -0.01em\">Μήνυμα προς το φαρμακείο</b><span style=\"padding: 3px 10px; border-radius: 999px; background: #ececf0; color: #48484a; font-size: 11px; font-weight: 800\">Προαιρετικό</span></div>\n              <textarea value=\"{{fMsgVal}}\" onInput=\"{{fSetMsg}}\" rows=\"3\" maxlength=\"200\" placeholder=\"Δύο λόγια για την προώθηση, π.χ. τι είναι νέο τον μήνα που ζητάτε.\" aria-label=\"Μήνυμα προς το φαρμακείο\" style=\"{{fTaStyle}}\"></textarea>\n              <div style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: #636366\"><span>Χωρίς τιμές και στοιχεία επικοινωνίας.</span><span style=\"font-variant-numeric: tabular-nums\">{{fMsgCount}} / 200</span></div>\n            </section>\n\n            <section style=\"padding: 18px 22px; border-radius: 20px; background: #eef1f6; display: flex; flex-direction: column; gap: 12px\">\n              <b style=\"font-size: 14px\">Ποιος βλέπει τι</b>\n              <div style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px 14px; font-size: 13px; line-height: 1.45\">\n                <b>Το φαρμακείο</b><span style=\"color: #48484a\">την εταιρία, τη μάρκα, τα προϊόντα, τον μήνα, τη θέση, το ποσό που εισπράττει και το μήνυμά σας.</span>\n                <b>Τα Κεντρικά</b><span style=\"color: #48484a\">τα ίδια και τα στοιχεία επικοινωνίας σας: {{fWhoLine}}.</span>\n                <b>Το αρχείο σας</b><span style=\"color: #48484a\">το διαφημιστικό αρχείο το δηλώνετε μετά την αποδοχή, στα «Αιτήματά μου». Δεν χρειάζεται για να στείλετε.</span>\n              </div>\n            </section>\n          </div>\n\n          <div style=\"position: sticky; top: 0; display: flex; flex-direction: column; gap: 16px; min-width: 0\">\n            <section style=\"padding: 18px 20px 20px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 12px 32px rgba(10,20,50,0.08); display: flex; flex-direction: column; gap: 12px\">\n              <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: #636366\">ΕΤΣΙ ΘΑ ΤΟ ΔΕΙ ΤΟ ΦΑΡΜΑΚΕΙΟ</span>\n              <div style=\"display: flex; flex-direction: column; gap: 13px; padding: 16px; border-radius: 16px; background: #f5f5f7\">\n                <div style=\"display: flex; gap: 12px; align-items: center\">\n                  <span aria-hidden=\"true\" style=\"{{pvMonoStyle}}\">{{pvMono}}</span>\n                  <div style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0\"><span style=\"{{pvNameStyle}}\">{{pvName}}</span><span style=\"font-size: 12px; color: #636366; line-height: 1.3\">{{pvCo}}</span></div>\n                </div>\n                <span style=\"align-self: flex-start; padding: 2px 9px; border-radius: 999px; background: #e8f0fc; color: #1a45b0; font-size: 10.5px; font-weight: 800\">Αίτημα εταιρίας</span>\n                <div style=\"display: flex; flex-direction: column; gap: 7px\"><span style=\"font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; color: #636366\">ΤΙ ΠΡΟΩΘΕΙ</span>\n                  <div style=\"display: flex; fle   // Το φαρμακείο απαντά μέσα σε 7 ημέρες από το αίτημα. Ένας μήνας δέχεται αιτήματα όσο η λήξη (σήμερα + 7) πέφτει πριν κλειδώσει ο μήνας, δηλαδή πριν τις 15 του προηγούμενου μήνα.

  answerBy() { return this.fmtD(this.plusDays(7)); }
  // τελευταία μέρα αιτήματος για τον μήνα m του 2027 = 15 του προηγούμενου μήνα μείον 7 ημέρες = 8 του προηγούμενου μήνα
  lastReq(m) { return this.fmtD(new Date(2027, m - 1, 8)); }

  NET2() {
    if (this._net2) return this._net2;
    const base = this.NET();
    let a = 7771;
    const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const extra = [0.10, 0.10, 0.11, 0.09, 0.09, 0.13, 0.17, 0.19, 0.11, 0.07, 0.07, 0.12];
    const w = [0.17, 0.15, 0.13, 0.11, 0.10, 0.09, 0.08, 0.07, 0.10];
    this._net2 = base.map((p) => {
      const xy = this.PROJ(p.lat, p.lon);
      const st = [];
      for (let m = 0; m < 12; m++) {
        const row = [];
        [1, 2].forEach((pos) => {
          const r1 = rnd(), r2 = rnd();
          const declared = p.av[m] === pos;
          let cum = 0, ci = w.length - 1; for (let i = 0; i < w.length; i++) { cum += w[i]; if (r2 < cum) { ci = i; break; } }
          row.push(declared ? 'cen' : r1 < extra[m] ? 'free' : 'b' + ci);
        });
        st.push(row);
      }
      return Object.assign({}, p, { x: xy.x, y: xy.y, st: st });
    });
    return this._net2;
  }
  // κατάσταση θέσης: none (δεν υπάρχει / φαρμακείο μη ενεργοποιημένο) | free | cen (διαθέσιμο και στα Κεντρικά) | b0..b8 (άλλη εταιρία) | own-wait | own-deal
  OWN() { return { '1|2|2': 'wait', '0|2|1': 'deal' }; }
  slot(p, m, pos) {
    if (!p.act || pos > p.npos) return 'none';
    const o = this.OWN()[p.id + '|' + m + '|' + pos];
    return o ? 'own-' + o : p.st[m][pos - 1];
  }
  isFree(s) { return s === 'free' || s === 'cen'; }

    return Object.assign({},r,{name:q.title||r.name,orient:q.format==='horizontal'?'Οριζόντια · 1920×1080':'Κάθετη · 1080×1920',meta:'Μέγεθος οθόνης, σημείο στον πάγκο και ράφια: δεν έχουν δηλωθεί ακόμα · οθόνη με όλα τα ράφια της, σε μία τιμή: '+this.eur(q.price)+' / μήνα'});});
   v.phPromoOn=true;v.phCompOn=false;v.phCompFew=true;
  }
  return v;
 }
}
async function mkStart(){
 if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(MK_KEY)){mkGate('Χρειάζεστε προσωπικό σύνδεσμο','Το SpaceCoLLab Market ανοίγει μόνο με τον σύνδεσμο που σας έδωσε η Pharmaplus.');return;}
 if(!window.supabase||!window.supabase.createClient){mkGate('Δεν φορτώθηκε η σελίδα','Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά.');return;}
 LIVE.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
 mkGate('SpaceCoLLab Market','Φόρτωση φαρμακείων…');
 try{
  const list=await mkRpc('scl360_mk_list',{p_key:MK_KEY});
  LIVE.net=mkNet(Array.isArray(list)?list:[],Component.prototype);
  if(!LIVE.net.length){mkGate('Δεν υπάρχουν ακόμα φαρμακεία','Δοκιμάστε ξανά αργότερα.');return;}
  document.getElementById('mkRoot').innerHTML='';
  mkMount(new Live({}));
 }catch(e){
  const m=String(e&&e.message||'');
  if(/πρόσβαση Market|42501/i.test(m))mkGate('Ο σύνδεσμος δεν ισχύει','Ζητήστε νέο σύνδεσμο από την Pharmaplus.');
  else{console.error(e);mkGate('Δεν φορτώθηκαν τα φαρμακεία','Δοκιμάστε ξανά σε λίγο.');}
 }
}
mkStart();

})();
